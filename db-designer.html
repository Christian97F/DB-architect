function doImport(){
  var ta=document.getElementById('import-ta'); if(!ta||!ta.value.trim())return;
  var text=ta.value.trim(), mode=ta.dataset.mode||'json';
  if(mode==='sql'){importSQL(text);return;}
  try{
    var data=JSON.parse(text);
    if(data.nodes){
      state.nodes=data.nodes; state.relations=data.relations||[];
      var maxId=0;
      state.nodes.forEach(function(n){var i=parseInt(n.id.split('_')[1]||0);if(i>maxId)maxId=i;});
      state.nextId=maxId+1;
      if(data.dbType){
        state.dbType=data.dbType;
        document.querySelectorAll('.dbtab').forEach(function(t){t.classList.toggle('active',t.dataset.type===data.dbType);});
        updateSidebar();
      }
      canvas.querySelectorAll('.node').forEach(function(n){n.remove();});
      canvasSvg.innerHTML='';
      state.nodes.forEach(function(n){renderNode(n);});
      drawRelations(); autoLayout();
      showMsg('Importiert: '+state.nodes.length+' Elemente');
      closeModal();
    }
  }catch(e){showMsg('Fehler: Ungültiges JSON – '+e.message);}
}

function importSQL(raw){
  // ── Step 1: Pre-clean the dump ──────────────────────
  var sql=raw
    // remove C-style comments /* ... */
    .replace(/\/\*[\s\S]*?\*\//g,' ')
    // remove line comments -- ...
    .replace(/--[^\n]*/g,' ')
    // remove MySQL conditional comments /*!...*/
    .replace(/\/\*![\s\S]*?\*\//g,' ')
    // remove lines that are just noise in dumps
    .replace(/^\s*(SET|LOCK|UNLOCK|USE|START\s+TRANSACTION|COMMIT|ROLLBACK|DROP\s+TABLE|DELIMITER|BEGIN)[^;]*;/gim,' ')
    // remove INSERT / UPDATE / DELETE / REPLACE statements entirely (can be huge)
    .replace(/(INSERT|UPDATE|DELETE|REPLACE)\s+[^;]*;/gi,' ')
    // collapse whitespace runs
    .replace(/\s+/g,' ');

  // ── Step 2: Extract CREATE TABLE blocks ─────────────
  // We find CREATE TABLE ... then balance parentheses to get the full body,
  // because the body can contain nested parens (ENUM, CHECK, etc.)
  var tables=[];
  var reName=/CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?([`"'\[]?[\w$]+[`"'\]]?)\s*\(/gi;
  var m;
  while((m=reName.exec(sql))!==null){
    var tableName=m[1].replace(/[`"'\[\]]/g,'');
    // balance parens from opening paren position
    var start=m.index+m[0].length-1; // position of '('
    var depth=0, i=start, bodyStart=start+1;
    while(i<sql.length){
      var ch=sql[i];
      // handle string literals inside SQL (skip their content)
      if(ch==="'"||ch==='"'||ch==='`'){
        var q=ch; i++;
        while(i<sql.length&&!(sql[i]===q&&sql[i-1]!=='\\')){i++;}
      } else if(ch==='('){depth++;}
      else if(ch===')'){depth--;if(depth===0)break;}
      i++;
    }
    var body=sql.substring(bodyStart,i);
    tables.push({name:tableName,body:body,pos:m.index});
  }

  if(tables.length===0){showMsg('Keine CREATE TABLE Statements gefunden');return;}

  // ── Step 3: Parse columns from each table body ──────
  var typeMap={
    'INT':'INT','INTEGER':'INT','BIGINT':'BIGINT','SMALLINT':'SMALLINT','TINYINT':'TINYINT',
    'MEDIUMINT':'INT','SERIAL':'SERIAL','BOOL':'BOOLEAN','BOOLEAN':'BOOLEAN',
    'FLOAT':'FLOAT','DOUBLE':'DOUBLE','REAL':'DOUBLE','NUMERIC':'DECIMAL',
    'DECIMAL':'DECIMAL','DEC':'DECIMAL','MONEY':'DECIMAL(10,2)',
    'VARCHAR':'VARCHAR','CHARACTER VARYING':'VARCHAR','NVARCHAR':'VARCHAR',
    'CHAR':'CHAR','NCHAR':'CHAR','TEXT':'TEXT','TINYTEXT':'TEXT','MEDIUMTEXT':'TEXT','LONGTEXT':'TEXT',
    'CLOB':'TEXT','NTEXT':'TEXT',
    'DATE':'DATE','DATETIME':'DATETIME','TIMESTAMP':'TIMESTAMP',
    'TIME':'TIME','YEAR':'YEAR','INTERVAL':'INTERVAL',
    'BINARY':'BLOB','VARBINARY':'BLOB','BLOB':'BLOB','TINYBLOB':'BLOB','MEDIUMBLOB':'BLOB','LONGBLOB':'BLOB','BYTEA':'BYTEA',
    'JSON':'JSON','JSONB':'JSONB','XML':'TEXT','UUID':'UUID',
    'ENUM':'ENUM','SET':'ENUM','BIT':'BOOLEAN',
    'ARRAY':'ARRAY','HSTORE':'JSON','INET':'TEXT','CIDR':'TEXT','MACADDR':'TEXT',
    'GEOMETRY':'TEXT','POINT':'TEXT','POLYGON':'TEXT'
  };

  // Extract primary keys from table-level PK constraint
  function extractTablePKs(body){
    var pks=[];
    var pkRx=/PRIMARY\s+KEY\s*\(([^)]+)\)/gi;
    var pm;
    while((pm=pkRx.exec(body))!==null){
      pm[1].split(',').forEach(function(p){pks.push(p.trim().replace(/[`"']/g,'').toUpperCase());});
    }
    return pks;
  }

  // Split body into column/constraint clauses, respecting nested parens
  function splitClauses(body){
    var clauses=[];
    var depth=0,current='',i=0;
    while(i<body.length){
      var ch=body[i];
      if(ch==="'"||ch==='"'||ch==='`'){
        var q=ch; current+=ch; i++;
        while(i<body.length){
          current+=body[i];
          if(body[i]===q&&body[i-1]!=='\\')break;
          i++;
        }
      } else if(ch==='('){depth++;current+=ch;}
      else if(ch===')'){depth--;current+=ch;}
      else if(ch===','&&depth===0){
        clauses.push(current.trim());current='';
        i++;continue;
      } else {current+=ch;}
      i++;
    }
    if(current.trim())clauses.push(current.trim());
    return clauses;
  }

  function parseType(raw){
    var clean=raw.trim().replace(/\s+/,' ');
    // extract base type (before space or paren)
    var base=(clean.match(/^([A-Z\s]+?)(?:\s*\(|\s+|$)/i)||[,''])[1].trim().toUpperCase();
    // map to known type
    var mapped=typeMap[base]||base;
    // preserve param if original had one and mapped type needs it
    var paramM=clean.match(/\(([^)]+)\)/);
    var param=paramM?paramM[1]:'';
    if(param&&(mapped==='VARCHAR'||mapped==='CHAR'||mapped==='DECIMAL'||mapped==='ENUM'))
      return mapped+'('+param+')';
    return mapped;
  }

  // Clear existing relational tables
  state.nodes=state.nodes.filter(function(n){return n.subtype!=='table';});
  state.relations=[];
  canvas.querySelectorAll('.node[data-type="relational"]').forEach(function(n){n.remove();});
  var fkCandidates=[]; // {fromTable, fromCol, toTable, toCol}

  tables.forEach(function(tbl,idx){
    var pks=extractTablePKs(tbl.body);
    var clauses=splitClauses(tbl.body);
    var columns=[];

    clauses.forEach(function(clause){
      var cl=clause.trim();
      if(!cl)return;
      var up=cl.toUpperCase();

      // Skip table-level constraints (not column definitions)
      if(/^(PRIMARY\s+KEY|UNIQUE\s+(KEY\s+|INDEX\s+)?|KEY\s+|INDEX\s+|FULLTEXT|SPATIAL|CHECK\s*\()/i.test(cl))return;

      // CONSTRAINT ... FOREIGN KEY
      var fkM=cl.match(/CONSTRAINT\s+[`"']?\w+[`"']?\s+FOREIGN\s+KEY\s*\(([^)]+)\)\s*REFERENCES\s+[`"']?(\w+)[`"']?\s*\(([^)]+)\)/i);
      if(!fkM) fkM=cl.match(/FOREIGN\s+KEY\s*\(([^)]+)\)\s*REFERENCES\s+[`"']?(\w+)[`"']?\s*\(([^)]+)\)/i);
      if(fkM){
        var fromCols=fkM[1].split(',').map(function(c){return c.trim().replace(/[`"']/g,'');});
        var toTable=fkM[2];
        var toCols=fkM[3].split(',').map(function(c){return c.trim().replace(/[`"']/g,'');});
        fromCols.forEach(function(fc,i){
          fkCandidates.push({fromTable:tbl.name,fromCol:fc,toTable:toTable,toCol:toCols[i]||toCols[0]});
          // mark column as FK
          columns.forEach(function(col){if(col.name.toLowerCase()===fc.toLowerCase())col.fk=true;});
        });
        return;
      }

      // Column definition: name type [constraints...]
      var colM=cl.match(/^[`"'\[]?([\w$]+)[`"'\]]?\s+(.+)$/i);
      if(!colM)return;
      var colName=colM[1];
      var rest=colM[2];

      // Skip SQL keywords that aren't column names
      if(/^(PRIMARY|UNIQUE|KEY|INDEX|CONSTRAINT|CHECK|FOREIGN|FULLTEXT|SPATIAL|ENGINE|AUTO_INCREMENT|DEFAULT\s+CHARSET|COLLATE|ROW_FORMAT|COMMENT|CHARACTER\s+SET)/i.test(colName))return;

      var typeRaw=(rest.match(/^([A-Z][A-Z0-9_\s]*?(?:\([^)]*\))?)(?:\s|$)/i)||['',''])[1].trim();
      var colType=parseType(typeRaw);
      var isNN=/NOT\s+NULL/i.test(rest)||/PRIMARY\s+KEY/i.test(rest);
      var isPK=/PRIMARY\s+KEY/i.test(rest)||pks.indexOf(colName.toUpperCase())>=0;
      var isFK=/REFERENCES/i.test(rest);

      // REFERENCES inline
      if(isFK){
        var refM=rest.match(/REFERENCES\s+[`"']?(\w+)[`"']?\s*\(([^)]+)\)/i);
        if(refM) fkCandidates.push({fromTable:tbl.name,fromCol:colName,toTable:refM[1],toCol:refM[2].replace(/[`"']/g,'').trim()});
      }

      columns.push({name:colName,type:colType,pk:isPK,fk:isFK,nn:isNN,references:''});
    });

    if(!columns.length){
      // fallback: table with no parseable columns → add placeholder
      columns.push({name:'(keine Spalten erkannt)',type:'',pk:false,fk:false,nn:false,references:''});
    }

    var id='node_'+(state.nextId++);
    var node={id:id,type:'relational',subtype:'table',x:0,y:0,data:{title:tbl.name,columns:columns}};
    state.nodes.push(node);
    renderNode(node);
  });

  // ── Step 4: Resolve FK relations ────────────────────
  // Also parse ALTER TABLE ... ADD FOREIGN KEY from the cleaned SQL
  var altRx=/ALTER\s+TABLE\s+[`"']?(\w+)[`"']?\s+ADD\s+(?:CONSTRAINT\s+[`"']?\w+[`"']?\s+)?FOREIGN\s+KEY\s*\(([^)]+)\)\s*REFERENCES\s+[`"']?(\w+)[`"']?\s*\(([^)]+)\)/gi;
  var am;
  while((am=altRx.exec(sql))!==null){
    fkCandidates.push({fromTable:am[1],fromCol:am[2].replace(/[`"'\s]/g,''),toTable:am[3],toCol:am[4].replace(/[`"'\s]/g,'')});
  }

  fkCandidates.forEach(function(fk){
    var fromNode=state.nodes.find(function(n){return n.data&&n.data.title.toLowerCase()===fk.fromTable.toLowerCase();});
    var toNode  =state.nodes.find(function(n){return n.data&&n.data.title.toLowerCase()===fk.toTable.toLowerCase();});
    if(!fromNode||!toNode)return;
    // set references on the column
    var col=fromNode.data.columns.find(function(c){return c.name.toLowerCase()===fk.fromCol.toLowerCase();});
    if(col){col.fk=true;col.references=fk.toTable+'.'+fk.toCol;}
    // avoid duplicate relations
    var exists=state.relations.find(function(r){return r.fromNodeId===fromNode.id&&r.fromCol===fk.fromCol;});
    if(!exists) state.relations.push({id:'rel_'+(state.nextId++),fromNodeId:fromNode.id,fromCol:fk.fromCol,toNodeId:toNode.id,toCol:fk.toCol});
  });

  // ── Step 5: Activate relational tab and layout ───────
  state.dbType='relational';
  document.querySelectorAll('.dbtab').forEach(function(t){t.classList.toggle('active',t.dataset.type==='relational');});
  updateSidebar();

  // re-render all to pick up fk markers
  state.nodes.forEach(function(n){if(n.subtype==='table')renderNode(n);});
  drawRelations();
  autoLayout();
  showMsg('✓ '+tables.length+' Tabellen importiert, '+state.relations.length+' FK-Beziehungen erkannt');
  closeModal();
}

// ── MODAL SYSTEM ──────────────────────────────────────
function showModal(title,body,onSave,isExport,isImport){
  closeModal();
  var overlay=document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='modal-overlay';
  var footer='';
  if(isExport) footer='<button class="btn primary" onclick="copyExport()">Kopieren</button><button class="btn primary" onclick="dlExport()">Download</button>';
  else if(isImport) footer='<button class="btn primary" onclick="doImport()">Importieren</button>';
  else if(onSave) footer='<button class="btn primary" onclick="window._pendingSave&&window._pendingSave()">Speichern</button>';
  footer+='<button class="btn" onclick="closeModal()">Schließen</button>';
  overlay.innerHTML='<div class="modal"><div class="modal-header"><h2>'+title+'</h2><button class="node-del" onclick="closeModal()" style="width:22px;height:22px;font-size:14px">✕</button></div><div class="modal-body">'+body+'</div><div class="modal-footer">'+footer+'</div></div>';
  document.body.appendChild(overlay);
  window._pendingSave=onSave;
  overlay.addEventListener('click',function(e){if(e.target===overlay)closeModal();});
}
function closeModal(){var o=document.getElementById('modal-overlay');if(o)o.remove();}
function copyExport(){var ta=document.getElementById('export-ta');if(ta){navigator.clipboard.writeText(ta.value);showMsg('Kopiert!');}}
function dlExport(){
  var ta=document.getElementById('export-ta'); if(!ta)return;
  var v=ta.value.trim();
  var ext=v.startsWith('{')&&v.includes('"nodes"')?'json':v.startsWith('--')||v.startsWith('CREATE')?'sql':v.startsWith('//')?'txt':'txt';
  var a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(ta.value);
  a.download='schema.'+ext; a.click();
}

// ── IMAGE / PDF EXPORT ────────────────────────────────
function getExportBounds(){
  var nodes=state.nodes;
  var pad=50;
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(function(n){
    var el=document.getElementById(n.id); if(!el)return;
    var r=el.getBoundingClientRect(), cr=canvasWrap.getBoundingClientRect();
    var x=(r.left-cr.left-panX)/scale, y=(r.top-cr.top-panY)/scale;
    var w=r.width/scale, h=r.height/scale;
    minX=Math.min(minX,x-pad); minY=Math.min(minY,y-pad);
    maxX=Math.max(maxX,x+w+pad); maxY=Math.max(maxY,y+h+pad);
  });
  // also include relations SVG extent (arrows may extend beyond nodes)
  var svgPaths=canvasSvg.querySelectorAll('path');
  svgPaths.forEach(function(p){
    try{var b=p.getBBox();
      var cr=canvasWrap.getBoundingClientRect();
      // getBBox is in SVG coords (already in canvas space due to transform)
      minX=Math.min(minX,b.x-pad); minY=Math.min(minY,b.y-pad);
      maxX=Math.max(maxX,b.x+b.width+pad); maxY=Math.max(maxY,b.y+b.height+pad);
    }catch(e){}
  });
  return {minX:minX,minY:minY,W:maxX-minX,H:maxY-minY,offX:-minX,offY:-minY};
}

function renderToCanvas(dpr){
  var nodes=state.nodes;
  if(!nodes.length) return null;
  var bounds=getExportBounds();
  var W=bounds.W, H=bounds.H, offX=bounds.offX, offY=bounds.offY;

  var cvs=document.createElement('canvas');
  cvs.width=Math.ceil(W*dpr); cvs.height=Math.ceil(H*dpr);
  var ctx=cvs.getContext('2d');
  ctx.scale(dpr,dpr);

  var light=document.body.classList.contains('light');
  var bgColor=light?'#f4f6fb':'#0d0f14';
  var gridColor=light?'rgba(0,0,0,.07)':'rgba(255,255,255,.035)';
  var textMain=light?'#1a1f2e':'#e8ecf4';
  var textSub=light?'#4a5270':'#8a95b0';
  var textMuted=light?'#9099b8':'#4a5570';

  ctx.fillStyle=bgColor; ctx.fillRect(0,0,W,H);

  // grid dots
  ctx.fillStyle=gridColor;
  for(var gx=0;gx<W;gx+=24) for(var gy=0;gy<H;gy+=24){ctx.beginPath();ctx.arc(gx,gy,0.8,0,Math.PI*2);ctx.fill();}

  // ── DRAW SVG ARROWS ──
  // Re-render relations directly to canvas using same geometry as drawRelations
  var cr0=canvasWrap.getBoundingClientRect();
  function canvasPt(el, tx, ty){
    // get node center in canvas coords
    var r=el.getBoundingClientRect();
    var cx=(r.left+r.width/2-cr0.left-panX)/scale;
    var cy=(r.top+r.height/2-cr0.top-panY)/scale;
    return {cx:cx, cy:cy};
  }
  function borderPt(el, tx, ty){
    var r=el.getBoundingClientRect();
    var cx=(r.left+r.width/2-cr0.left-panX)/scale;
    var cy=(r.top+r.height/2-cr0.top-panY)/scale;
    var hw=r.width/2/scale, hh=r.height/2/scale;
    var dx=tx-cx, dy=ty-cy;
    if(dx===0&&dy===0)return{x:cx,y:cy};
    var sx=dx!==0?Math.abs(hw/dx):Infinity, sy=dy!==0?Math.abs(hh/dy):Infinity;
    var s=Math.min(sx,sy);
    return{x:cx+dx*s, y:cy+dy*s};
  }
  function drawArrow(ctx, x1,y1, x2,y2, color, dashed, arrowColor){
    ctx.save();
    ctx.strokeStyle=color; ctx.lineWidth=1.8;
    if(dashed) ctx.setLineDash([6,4]); else ctx.setLineDash([]);
    // control points for bezier
    var dx=(x2-x1)*0.4, dy=(y2-y1)*0.4;
    var cp1x=x1+dx, cp1y=y1+dy, cp2x=x2-dx, cp2y=y2-dy;
    // arrowhead size
    var ARR=9;
    // tangent at t=1 of cubic bezier: 3*(P3-P2)
    var tanX=3*(x2-cp2x), tanY=3*(y2-cp2y);
    var tanLen=Math.sqrt(tanX*tanX+tanY*tanY)||1;
    var ux=tanX/tanLen, uy=tanY/tanLen; // unit tangent
    // shorten endpoint by arrowhead so line doesn't overshoot
    var ex=x2-ux*ARR, ey=y2-uy*ARR;
    // recompute cp2 to aim at shortened endpoint
    var cp2xS=ex-dx*0.5, cp2yS=ey-dy*0.5;
    ctx.beginPath();
    ctx.moveTo(x1+offX,y1+offY);
    ctx.bezierCurveTo(cp1x+offX,cp1y+offY, cp2x+offX,cp2y+offY, ex+offX,ey+offY);
    ctx.stroke();
    if(arrowColor){
      // exact angle from tangent
      var angle=Math.atan2(uy,ux);
      var spread=0.38;
      ctx.setLineDash([]);
      ctx.fillStyle=arrowColor;
      ctx.beginPath();
      ctx.moveTo(x2+offX, y2+offY);
      ctx.lineTo(x2+offX - ARR*Math.cos(angle-spread), y2+offY - ARR*Math.sin(angle-spread));
      ctx.lineTo(x2+offX - ARR*Math.cos(angle+spread), y2+offY - ARR*Math.sin(angle+spread));
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  state.relations.forEach(function(rel){
    var fromEl=document.getElementById(rel.fromNodeId);
    var toEl=document.getElementById(rel.toNodeId);
    if(!fromEl||!toEl) return;
    var fc=canvasPt(fromEl), tc=canvasPt(toEl);
    if(rel.graphLink){
      var fp=borderPt(fromEl,tc.cx,tc.cy), tp=borderPt(toEl,fc.cx,fc.cy);
      var color=rel.isTo?'rgba(176,79,247,.85)':'rgba(176,79,247,.4)';
      drawArrow(ctx,fp.x,fp.y,tp.x,tp.y,color,!rel.isTo,rel.isTo&&rel.directed?'rgba(176,79,247,1)':null);
    } else if(rel.docRef){
      var fp=borderPt(fromEl,tc.cx,tc.cy), tp=borderPt(toEl,fc.cx,fc.cy);
      drawArrow(ctx,fp.x,fp.y,tp.x,tp.y,'rgba(61,232,160,.7)',true,'rgba(61,232,160,.9)');
    } else if(rel.tsLink){
      var fp=borderPt(fromEl,tc.cx,tc.cy), tp=borderPt(toEl,fc.cx,fc.cy);
      drawArrow(ctx,fp.x,fp.y,tp.x,tp.y,rel.isTo?'rgba(247,79,106,.85)':'rgba(247,79,106,.4)',!rel.isTo,rel.isTo?'rgba(247,79,106,1)':null);
    } else if(rel.cfViewLink){
      var fp=borderPt(fromEl,tc.cx,tc.cy), tp=borderPt(toEl,fc.cx,fc.cy);
      drawArrow(ctx,fp.x,fp.y,tp.x,tp.y,'rgba(79,240,247,.65)',true,'rgba(79,240,247,.9)');
    } else {
      // relational FK: right edge → left edge, row height
      var dot=fromEl.querySelector('.conn-dot[data-col="'+CSS.escape(rel.fromCol)+'"]');
      var toDot=toEl.querySelector('.conn-dot[data-col="'+CSS.escape(rel.toCol)+'"]')||toEl.querySelector('.conn-dot');
      if(!dot)return;
      function dotPos(d){var dr=d.getBoundingClientRect();return{x:(dr.left+dr.width/2-cr0.left-panX)/scale,y:(dr.top+dr.height/2-cr0.top-panY)/scale};}
      var fdp=dotPos(dot);
      var fromR=fromEl.getBoundingClientRect();
      var toR=toEl.getBoundingClientRect();
      var fx=(fromR.right-cr0.left-panX)/scale, fy=fdp.y;
      var tx=(toR.left-cr0.left-panX)/scale, ty=toDot?dotPos(toDot).y:tc.cy;
      var markerLen=10;
      var txAdj=tx+(tx>fx?-markerLen:markerLen);
      ctx.save();
      ctx.strokeStyle='rgba(79,142,247,.75)'; ctx.lineWidth=1.8; ctx.setLineDash([]);
      var ddx=Math.abs(txAdj-fx)*0.5;
      var cp1rx=fx+ddx, cp1ry=fy, cp2rx=txAdj-ddx, cp2ry=ty;
      var ARR2=9;
      // tangent at t=1: 3*(P3-P2)
      var tanRx=3*(txAdj-cp2rx), tanRy=3*(ty-cp2ry);
      var tanRLen=Math.sqrt(tanRx*tanRx+tanRy*tanRy)||1;
      var uxR=tanRx/tanRLen, uyR=tanRy/tanRLen;
      var exR=txAdj-uxR*ARR2, eyR=ty-uyR*ARR2;
      ctx.beginPath();
      ctx.moveTo(fx+offX,fy+offY);
      ctx.bezierCurveTo(cp1rx+offX,cp1ry+offY, cp2rx+offX,cp2ry+offY, exR+offX,eyR+offY);
      ctx.stroke();
      var angR=Math.atan2(uyR,uxR);
      ctx.fillStyle='rgba(79,142,247,.9)';
      ctx.beginPath();
      ctx.moveTo(txAdj+offX,ty+offY);
      ctx.lineTo(txAdj+offX-ARR2*Math.cos(angR-0.38),ty+offY-ARR2*Math.sin(angR-0.38));
      ctx.lineTo(txAdj+offX-ARR2*Math.cos(angR+0.38),ty+offY-ARR2*Math.sin(angR+0.38));
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  });

  // ── DRAW NODE CARDS ──
  var COLORS={
    border:{'table':'rgba(79,142,247,.5)','collection':'rgba(61,232,160,.5)','graph-node':'rgba(176,79,247,.5)','graph-edge':'rgba(247,200,79,.5)','namespace':'rgba(247,200,79,.5)','kv-flow':'rgba(247,200,79,.7)','measurement':'rgba(247,79,106,.5)','ts-task':'rgba(247,79,106,.7)','column':'rgba(79,240,247,.5)','cf-view':'rgba(79,240,247,.7)','doc-index':'rgba(61,232,160,.7)'},
    header:{'table':'rgba(79,142,247,.14)','collection':'rgba(61,232,160,.12)','graph-node':'rgba(176,79,247,.14)','graph-edge':'rgba(247,200,79,.12)','namespace':'rgba(247,200,79,.12)','kv-flow':'rgba(247,200,79,.18)','measurement':'rgba(247,79,106,.12)','ts-task':'rgba(247,79,106,.18)','column':'rgba(79,240,247,.12)','cf-view':'rgba(79,240,247,.18)','doc-index':'rgba(61,232,160,.18)'},
    title:{'table':'#4f8ef7','collection':'#3de8a0','graph-node':'#b04ff7','graph-edge':'#f7c84f','namespace':'#f7c84f','kv-flow':'#f7c84f','measurement':'#f74f6a','ts-task':'#f74f6a','column':'#4ff0f7','cf-view':'#4ff0f7','doc-index':'#3de8a0'}
  };
  var typeColors={'INT':'#f7c84f','BIGINT':'#f7c84f','SERIAL':'#f7c84f','SMALLINT':'#f7c84f','TINYINT':'#f7c84f','VARCHAR(255)':'#4ff0f7','TEXT':'#4ff0f7','CHAR(1)':'#4ff0f7','UUID':'#f78c4f','BOOLEAN':'#3de8a0','FLOAT':'#b04ff7','DOUBLE':'#b04ff7','DECIMAL(10,2)':'#b04ff7','DATE':'#f74f6a','DATETIME':'#f74f6a','TIMESTAMP':'#f74f6a','JSON':'#4f8ef7','JSONB':'#4f8ef7','BLOB':'#8a95b0','BYTEA':'#8a95b0'};

  nodes.forEach(function(n){
    var el=document.getElementById(n.id); if(!el)return;
    var r=el.getBoundingClientRect(), cwr=canvasWrap.getBoundingClientRect();
    var x=(r.left-cwr.left-panX)/scale+offX;
    var y=(r.top-cwr.top-panY)/scale+offY;
    var w=r.width/scale, h=r.height/scale;
    var sub=n.subtype;

    // card background + shadow
    ctx.save();
    ctx.shadowColor=light?'rgba(0,0,0,.18)':'rgba(0,0,0,.55)';
    ctx.shadowBlur=14; ctx.shadowOffsetY=5;
    ctx.fillStyle=light?'#ffffff':'#111318';
    roundRect(ctx,x,y,w,h,8); ctx.fill();
    ctx.restore();

    // border
    ctx.strokeStyle=COLORS.border[sub]||'rgba(80,100,160,.5)'; ctx.lineWidth=1.5;
    roundRect(ctx,x,y,w,h,8); ctx.stroke();

    // header bg (top-rounded only)
    var hh=34;
    ctx.fillStyle=COLORS.header[sub]||'rgba(79,142,247,.1)';
    ctx.save(); ctx.beginPath();
    ctx.moveTo(x+8,y); ctx.lineTo(x+w-8,y); ctx.quadraticCurveTo(x+w,y,x+w,y+8);
    ctx.lineTo(x+w,y+hh); ctx.lineTo(x,y+hh); ctx.lineTo(x,y+8);
    ctx.quadraticCurveTo(x,y,x+8,y); ctx.closePath(); ctx.fill(); ctx.restore();

    // header divider
    ctx.strokeStyle=COLORS.border[sub]||'rgba(80,100,160,.3)'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(x,y+hh); ctx.lineTo(x+w,y+hh); ctx.stroke();

    // icon + title
    var icons={'table':'▦','collection':'◎','graph-node':'●','graph-edge':'↔','namespace':'⌗','kv-flow':'→','measurement':'~','ts-task':'↓','column':'≡','cf-view':'◈','doc-index':'⊡'};
    ctx.fillStyle=COLORS.title[sub]||'#4f8ef7';
    ctx.font='11px JetBrains Mono, monospace';
    ctx.fillText(icons[sub]||'·', x+9, y+21);
    ctx.font='bold 12px Syne, sans-serif';
    ctx.fillText((n.data.title||'').substring(0,28), x+24, y+22);

    // rows — type-aware drawing
    var rowY=y+hh+5;
    var ROW_H=17;

    function drawRow(name, type, badge, badgeColor){
      if(rowY+ROW_H>y+h-4) return;
      var nameColor=textMain, typeColor=typeColors[type]||textMuted;
      // badge (PK/FK)
      if(badge){
        ctx.fillStyle=badgeColor||'rgba(247,200,79,.15)';
        roundRect(ctx,x+8,rowY+1,18,ROW_H-4,2); ctx.fill();
        ctx.fillStyle=badgeColor&&badgeColor.includes('200')?'#f7c84f':'#f78c4f';
        ctx.font='bold 8px JetBrains Mono, monospace';
        ctx.fillText(badge,x+9,rowY+10);
      }
      // name
      ctx.fillStyle=nameColor;
      ctx.font='11px JetBrains Mono, monospace';
      ctx.fillText((name||'').substring(0,20),x+30,rowY+11);
      // type pill
      if(type){
        var typeShort=(type||'').substring(0,14);
        var tw=ctx.measureText(typeShort).width+8;
        var tx2=x+w-tw-6;
        ctx.fillStyle=light?'rgba(0,0,0,.07)':'rgba(255,255,255,.07)';
        roundRect(ctx,tx2,rowY+2,tw,ROW_H-5,3); ctx.fill();
        ctx.fillStyle=typeColor;
        ctx.font='9.5px JetBrains Mono, monospace';
        ctx.fillText(typeShort,tx2+4,rowY+11);
      }
      rowY+=ROW_H;
    }

    function drawSectionLabel(label, color){
      if(rowY+12>y+h-4) return;
      ctx.fillStyle=color||textMuted;
      ctx.font='8px JetBrains Mono, monospace';
      ctx.fillText(label.toUpperCase(),x+10,rowY+9);
      rowY+=13;
    }

    if(sub==='table'){
      (n.data.columns||[]).forEach(function(col){
        var badge=col.pk?'PK':col.fk?'FK':null;
        var badgeColor=col.pk?'rgba(247,200,79,.15)':'rgba(247,140,79,.15)';
        drawRow(col.name, col.type, badge, badgeColor);
      });
    } else if(sub==='collection'){
      (n.data.fields||[]).forEach(function(f){
        drawRow(f.key, f.type, f.badge||null, 'rgba(79,142,247,.15)');
        if(f.nested) f.nested.forEach(function(nf){ drawRow('  '+nf.key,nf.type,null,null); });
      });
    } else if(sub==='graph-node'||sub==='graph-edge'){
      if(sub==='graph-edge'&&n.data.fromLabel){
        ctx.fillStyle=textMuted; ctx.font='9px JetBrains Mono, monospace';
        ctx.fillText('('+n.data.fromLabel+') → ('+n.data.toLabel+')',x+10,rowY+10); rowY+=14;
      }
      (n.data.props||[]).forEach(function(p){ drawRow(p.name,p.type,null,null); });
    } else if(sub==='namespace'){
      (n.data.keys||[]).forEach(function(k){ drawRow(k.pattern,k.type,null,null); });
    } else if(sub==='measurement'){
      drawSectionLabel('Tags','rgba(247,79,106,.7)');
      (n.data.tags||[]).forEach(function(t){ drawRow(t.name,'string',null,null); });
      drawSectionLabel('Fields',textMuted);
      (n.data.fields||[]).forEach(function(f){ drawRow(f.name,f.type,null,null); });
    } else if(sub==='column'||sub==='cf-view'){
      drawSectionLabel('Partition Key','rgba(79,240,247,.7)');
      (n.data.partitionKeys||[]).forEach(function(k){ drawRow(k.name,k.type,'PK','rgba(79,240,247,.15)'); });
      if((n.data.clusteringKeys||[]).length){ drawSectionLabel('Clustering Key',textMuted); (n.data.clusteringKeys||[]).forEach(function(k){ drawRow(k.name,k.type,'CK','rgba(247,200,79,.15)'); }); }
      (n.data.columns||[]).forEach(function(c){ drawRow(c.name,c.type,null,null); });
    } else if(sub==='doc-index'){
      ctx.fillStyle=textMuted; ctx.font='9px JetBrains Mono, monospace';
      ctx.fillText('on: '+(n.data.collection||''),x+10,rowY+10); rowY+=14;
      (n.data.fields||[]).forEach(function(f){ drawRow(f.key,(f.direction===1?'ASC':'DESC'),f.unique?'U':null,'rgba(61,232,160,.15)'); });
    } else if(sub==='kv-flow'||sub==='ts-task'){
      ctx.fillStyle=textMuted; ctx.font='9px JetBrains Mono, monospace';
      ctx.fillText((n.data.from||'')+(sub==='kv-flow'?' → ':' ⟶ ')+(n.data.to||''),x+10,rowY+10); rowY+=14;
      if(n.data.label){ ctx.fillStyle=textMuted; ctx.font='9px JetBrains Mono, monospace'; ctx.fillText(n.data.label.substring(0,30),x+10,rowY+10); rowY+=13; }
      if(sub==='ts-task'&&n.data.aggregations){ (n.data.aggregations||[]).forEach(function(a){ drawRow(a.field,a.fn,null,null); }); }
    }
  });

  return cvs;
}

function exportImage(){
  if(!state.nodes.length){showMsg('Nichts zum Exportieren');return;}
  showMsg('Exportiere PNG…');
  setTimeout(function(){
    var cvs=renderToCanvas(2);
    if(!cvs)return;
    var link=document.createElement('a');
    link.download='db-schema-'+state.dbType+'.png';
    link.href=cvs.toDataURL('image/png');
    link.click();
    showMsg('PNG exportiert ✓');
  },50);
}

function exportPDF(){
  if(!state.nodes.length){showMsg('Nichts zum Exportieren');return;}
  showMsg('Rendere…');
  setTimeout(function(){
    var cvs=renderToCanvas(2);
    if(!cvs){showMsg('Export fehlgeschlagen');return;}
    var imgData=cvs.toDataURL('image/png');
    var W=Math.round(cvs.width/2), H=Math.round(cvs.height/2);

    var iframe=document.createElement('iframe');
    iframe.style.cssText='position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;border:none;visibility:hidden;';
    document.body.appendChild(iframe);

    // write content first, then hook print after load event
    var doc=iframe.contentDocument||iframe.contentWindow.document;
    doc.open();
    doc.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>DB Schema</title><style>'+
      '*{margin:0;padding:0;box-sizing:border-box;}'+
      'html,body{width:'+W+'px;height:'+H+'px;overflow:hidden;background:#fff;}'+
      'img{width:'+W+'px;height:'+H+'px;display:block;}'+
      '@media print{'+
        '@page{size:'+W+'px '+H+'px;margin:0;}'+
        'html,body{width:'+W+'px;height:'+H+'px;}'+
        'img{width:'+W+'px;height:'+H+'px;}'+
      '}'+
    '</style></head><body>'+
    '<img src="'+imgData+'"/>'+
    '</body></html>');
    doc.close();

    // wait for image to fully load inside iframe before printing
    var img=doc.querySelector('img');
    function doPrint(){
      showMsg('Druckdialog → Als PDF speichern');
      try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){}
      setTimeout(function(){
        if(document.body.contains(iframe)) document.body.removeChild(iframe);
      },5000);
    }
    if(img&&!img.complete){
      img.onload=doPrint;
      img.onerror=doPrint;
    } else {
      setTimeout(doPrint, 200);
    }
  },80);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
var codePanelOpen=false;
var activeCodeTab='';

var CODE_TABS={
  relational:[{id:'sql',label:'SQL DDL'}],
  document:[{id:'mongo',label:'MongoDB'}],
  graph:[{id:'cypher',label:'Cypher'}],
  keyvalue:[{id:'redis',label:'Redis'}],
  timeseries:[{id:'influx',label:'InfluxDB'}],
  column:[{id:'cql',label:'CQL'}]
};

function setupCodePanel(){
  // resize drag
  var resizer=document.getElementById('code-panel-resize');
  var panel=document.getElementById('code-panel');
  var dragging=false,startX=0,startW=0;
  resizer.addEventListener('mousedown',function(e){
    dragging=true; startX=e.clientX; startW=panel.offsetWidth; e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    var w=Math.max(180,Math.min(600,startW+(startX-e.clientX)));
    panel.style.width=w+'px';
  });
  document.addEventListener('mouseup',function(){dragging=false;});
}

function toggleCodePanel(){
  codePanelOpen=!codePanelOpen;
  var panel=document.getElementById('code-panel');
  var resizer=document.getElementById('code-panel-resize');
  var btn=document.getElementById('btn-code');
  panel.style.display=codePanelOpen?'flex':'none';
  resizer.style.display=codePanelOpen?'block':'none';
  if(btn) btn.style.borderColor=codePanelOpen?'var(--accent)':'';
  if(codePanelOpen) refreshCodePanel();
}

function refreshCodePanel(){
  if(!codePanelOpen)return;
  var tabs=CODE_TABS[state.dbType]||[];
  // also add JSON tab
  var allTabs=[{id:'json',label:'JSON'}].concat(tabs);
  if(!activeCodeTab||!allTabs.find(function(t){return t.id===activeCodeTab;})){
    activeCodeTab=allTabs[1]?allTabs[1].id:allTabs[0].id;
  }
  // render tab bar
  var tabHtml=allTabs.map(function(t){
    return '<div class="code-tab'+(t.id===activeCodeTab?' active':'')+'" onclick="setCodeTab(\''+t.id+'\')">'+t.label+'</div>';
  }).join('');
  document.getElementById('code-tabs').innerHTML=tabHtml;
  renderCodeOutput();
}

function setCodeTab(id){
  activeCodeTab=id;
  refreshCodePanel();
}

function renderCodeOutput(){
  var out=document.getElementById('code-output');
  if(!out)return;
  var raw='';
  if(activeCodeTab==='sql') raw=genSQL();
  else if(activeCodeTab==='cql') raw=genCQL();
  else if(activeCodeTab==='cypher') raw=genCypher();
  else if(activeCodeTab==='mongo') raw=genMongo();
  else if(activeCodeTab==='influx') raw=genInflux();
  else if(activeCodeTab==='redis') raw=genRedis();
  else if(activeCodeTab==='json') raw=JSON.stringify({version:'1.0',dbType:state.dbType,nodes:state.nodes,relations:state.relations},null,2);
  out.innerHTML=highlight(raw,activeCodeTab);
}

function highlight(code,type){
  // simple syntax highlighter
  var h=code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(type==='sql'||type==='cql'){
    h=h.replace(/\b(CREATE|TABLE|ALTER|ADD|CONSTRAINT|FOREIGN|KEY|PRIMARY|REFERENCES|NOT|NULL|IF|EXISTS|KEYSPACE|WITH|USE|REPLICATION|CLUSTERING|ORDER|BY|INT|TEXT|UUID|TIMESTAMP|BOOLEAN|BIGINT|FLOAT|DECIMAL|DOUBLE|BLOB|COUNTER|SERIAL|VARCHAR|CHAR|DATE|DATETIME|JSON|JSONB|BYTEA|ENUM|ARRAY)\b/g,'<span class="kw">$1</span>');
    h=h.replace(/(--[^\n]*)/g,'<span class="cm">$1</span>');
    h=h.replace(/`([^`]+)`/g,'<span class="pk">$1</span>');
  } else if(type==='cypher'){
    h=h.replace(/\b(CREATE|CONSTRAINT|FOR|REQUIRE|IS|UNIQUE|MATCH|RETURN|WHERE|WITH|MERGE|SET)\b/g,'<span class="kw">$1</span>');
    h=h.replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>');
    h=h.replace(/:([A-Z_]+)/g,':<span class="ty">$1</span>');
  } else if(type==='mongo'){
    h=h.replace(/\b(db|createCollection|runCommand|collMod|validator)\b/g,'<span class="kw">$1</span>');
    h=h.replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>');
    h=h.replace(/"([^"]+)":/g,'"<span class="pk">$1</span>":');
  } else if(type==='json'){
    h=h.replace(/"([^"]+)":/g,'"<span class="pk">$1</span>":');
    h=h.replace(/:\s*"([^"]+)"/g,': "<span class="str">$1</span>"');
    h=h.replace(/:\s*(true|false|null)/g,': <span class="kw">$1</span>');
  } else if(type==='redis'){
    h=h.replace(/^(#[^\n]*)/gm,'<span class="cm">$1</span>');
    h=h.replace(/\b(HSET|RPUSH|SADD|SET|GET|ZADD|EXPIRE|TTL|DEL)\b/g,'<span class="kw">$1</span>');
  } else if(type==='influx'){
    h=h.replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>');
  }
  return h;
}

}

// Helper: add relation by table title instead of array index (safe for reloads)
function addRelByTitle(fromTitle, fromCol, toTitle, toCol){
  var fromNode=state.nodes.find(function(n){return n.data&&n.data.title===fromTitle;});
  var toNode=state.nodes.find(function(n){return n.data&&n.data.title===toTitle;});
  if(fromNode&&toNode){
    // also set references on the column
    var col=fromNode.data.columns&&fromNode.data.columns.find(function(c){return c.name===fromCol;});
    if(col) col.references=toTitle+'.'+toCol;
    addRelation(fromNode.id, fromCol, toNode.id, toCol);
  }
}

// ── DRAG-TO-REORDER (Modal field lists) ──────────────────
var _dndIdx=null;
function setupDndContainer(containerId){
  var cont=document.getElementById(containerId);
  if(!cont)return;
  cont.addEventListener('dragstart',function(e){
    var row=e.target.closest('.col-editor-row');if(!row)return;
    var rows=Array.from(cont.querySelectorAll('.col-editor-row'));
    _dndIdx=rows.indexOf(row);
    e.dataTransfer.effectAllowed='move';
    setTimeout(function(){row.style.opacity='0.4';},0);
  });
  cont.addEventListener('dragend',function(e){
    var row=e.target.closest('.col-editor-row');if(row)row.style.opacity='';
    cont.querySelectorAll('.col-editor-row').forEach(function(r){r.classList.remove('dnd-over');});
    _dndIdx=null;
  });
  cont.addEventListener('dragover',function(e){
    e.preventDefault();e.dataTransfer.dropEffect='move';
    var row=e.target.closest('.col-editor-row');
    cont.querySelectorAll('.col-editor-row').forEach(function(r){r.classList.remove('dnd-over');});
    if(row)row.classList.add('dnd-over');
  });
  cont.addEventListener('dragleave',function(e){
    if(!cont.contains(e.relatedTarget))
      cont.querySelectorAll('.col-editor-row').forEach(function(r){r.classList.remove('dnd-over');});
  });
  cont.addEventListener('drop',function(e){
    e.preventDefault();
    var targetRow=e.target.closest('.col-editor-row');
    if(!targetRow||_dndIdx===null)return;
    var rows=Array.from(cont.querySelectorAll('.col-editor-row'));
    var toIdx=rows.indexOf(targetRow);
    if(toIdx===_dndIdx)return;
    var moving=rows[_dndIdx];
    if(toIdx<_dndIdx) cont.insertBefore(moving,targetRow);
    else cont.insertBefore(moving,targetRow.nextSibling);
    cont.querySelectorAll('.col-editor-row').forEach(function(r){r.classList.remove('dnd-over');});
    moving.style.opacity='';
    _dndIdx=null;
  });
}

  try{
    localStorage.setItem('db-architect-state',JSON.stringify({
      nodes:state.nodes, relations:state.relations, type:state.dbType, nextId:state.nextId
    }));
  }catch(e){}
}

function loadFromStorage(){
  try{
    var raw=localStorage.getItem('db-architect-state');
    if(!raw)return false;
    var data=JSON.parse(raw);
    if(!Array.isArray(data.nodes))return false;
    state.nodes=data.nodes;
    state.relations=data.relations||[];
    state.nextId=data.nextId||1;
    if(data.type){
      state.dbType=data.type;
      document.querySelectorAll('.dbtab').forEach(function(t){t.classList.toggle('active',t.dataset.type===data.type);});
      updateSidebar();
    }
    canvas.querySelectorAll('.node').forEach(function(n){n.remove();});
    canvasSvg.innerHTML='';
    state.nodes.forEach(function(n){renderNode(n);});
    drawRelations();
    updateHint();
    refreshCodePanel();
    return true;
  }catch(e){return false;}
}

function showToast(msg){
  var t=document.createElement('div');
  t.className='toast show';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';},1800);
  setTimeout(function(){t.remove();},2200);
}

// Patch snapshot to also save after state changes
var _origSnapshot=snapshot;
snapshot=function(label){
  _origSnapshot(label);
  saveToStorage();
};
// Patch applySnapshot (undo/redo) to also save
var _origApplySnapshot=applySnapshot;
applySnapshot=function(snap){
  _origApplySnapshot(snap);
  saveToStorage();
};
</script>
</body>
</html>
