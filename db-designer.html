<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB Architect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0b0e;--bg2:#111318;--bg3:#181c24;--bg4:#1e2330;
  --border:#2a3040;--border2:#3a4560;
  --text:#e8ecf4;--text2:#8a95b0;--text3:#4a5570;
  --accent:#4f8ef7;--accent2:#2d6ee0;
  --green:#3de8a0;--red:#f74f6a;--yellow:#f7c84f;--orange:#f78c4f;--purple:#b04ff7;--cyan:#4ff0f7;
  --clr-relational:#4f8ef7;--clr-document:#3de8a0;--clr-graph:#b04ff7;
  --clr-keyvalue:#f7c84f;--clr-timeseries:#f74f6a;--clr-column:#4ff0f7;
  --shadow:rgba(0,0,0,.4);
}
body.light {
  --bg:#f0f2f7;--bg2:#ffffff;--bg3:#e8ebf2;--bg4:#dde1ec;
  --border:#d0d5e8;--border2:#b0bbd8;
  --text:#1a1f2e;--text2:#4a5270;--text3:#9099b8;
  --accent:#2d6ee0;--accent2:#1a55c0;
  --green:#1ab872;--red:#d63050;--yellow:#c9900a;--orange:#c96010;--purple:#8030d0;--cyan:#0898a8;
  --clr-relational:#2d6ee0;--clr-document:#1ab872;--clr-graph:#8030d0;
  --clr-keyvalue:#c9900a;--clr-timeseries:#d63050;--clr-column:#0898a8;
  --shadow:rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none;transition:background .2s,color .2s;}
/* light mode grid override */
body.light #canvas-wrap{background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);}
/* theme toggle button */
.btn-theme{padding:4px 9px;font-size:14px;border-radius:5px;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:all .15s;line-height:1;}
.btn-theme:hover{background:var(--bg4);border-color:var(--accent);}
/* code panel */
#code-panel{width:300px;min-width:200px;max-width:500px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:background .2s;}
#code-panel-header{display:flex;align-items:center;padding:0 12px;height:38px;border-bottom:1px solid var(--border);gap:6px;flex-shrink:0;}
#code-panel-header span{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);flex:1;}
.code-tab{padding:3px 8px;font-size:10px;border-radius:3px;cursor:pointer;border:1px solid transparent;color:var(--text3);transition:all .1s;white-space:nowrap;}
.code-tab:hover{color:var(--text2);background:var(--bg3);}
.code-tab.active{color:var(--accent);border-color:var(--accent);background:rgba(79,142,247,.08);}
body.light .code-tab.active{background:rgba(45,110,224,.08);}
#code-output{flex:1;overflow:auto;padding:12px;font-size:10.5px;line-height:1.6;color:var(--text2);white-space:pre;font-family:'JetBrains Mono',monospace;tab-size:2;}
#code-output .kw{color:var(--accent);}
#code-output .str{color:var(--green);}
#code-output .cm{color:var(--text3);}
#code-output .ty{color:var(--yellow);}
#code-output .pk{color:var(--orange);}
#code-panel-resize{width:4px;cursor:col-resize;background:var(--border);flex-shrink:0;transition:background .1s;}
#code-panel-resize:hover{background:var(--accent);}
/* node box shadow via var */
.node{box-shadow:0 4px 20px var(--shadow);}
.node.dragging{box-shadow:0 12px 40px var(--shadow);}
#topbar{display:flex;align-items:center;height:48px;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px;flex-shrink:0;z-index:100;gap:4px;overflow-x:auto;}
#logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--text);margin-right:12px;white-space:nowrap;flex-shrink:0;}
#logo span{color:var(--accent);}
.top-sep{width:1px;height:26px;background:var(--border);margin:0 8px;flex-shrink:0;}
.dbtype-tabs{display:flex;gap:2px;flex-shrink:0;}
.dbtab{padding:4px 10px;font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:500;border-radius:4px;cursor:pointer;transition:all .15s;border:1px solid transparent;white-space:nowrap;}
.dbtab:hover{background:var(--bg3);}
.dbtab.active{border-color:currentColor;}
.dbtab[data-type="relational"]{color:var(--clr-relational);}
.dbtab[data-type="document"]{color:var(--clr-document);}
.dbtab[data-type="graph"]{color:var(--clr-graph);}
.dbtab[data-type="keyvalue"]{color:var(--clr-keyvalue);}
.dbtab[data-type="timeseries"]{color:var(--clr-timeseries);}
.dbtab[data-type="column"]{color:var(--clr-column);}
.dbtab.active[data-type="relational"]{background:rgba(79,142,247,.12);}
.dbtab.active[data-type="document"]{background:rgba(61,232,160,.12);}
.dbtab.active[data-type="graph"]{background:rgba(176,79,247,.12);}
.dbtab.active[data-type="keyvalue"]{background:rgba(247,200,79,.12);}
.dbtab.active[data-type="timeseries"]{background:rgba(247,79,106,.12);}
.dbtab.active[data-type="column"]{background:rgba(79,240,247,.12);}
.top-actions{margin-left:auto;display:flex;gap:5px;align-items:center;flex-shrink:0;}
.btn{padding:5px 11px;font-size:10.5px;font-family:'JetBrains Mono',monospace;border-radius:5px;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:all .15s;white-space:nowrap;}
.btn:hover{background:var(--bg4);color:var(--text);border-color:var(--accent);}
.btn.primary{background:var(--accent2);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent);}
.btn.danger{border-color:rgba(247,79,106,.4);color:var(--red);}
.btn.danger:hover{background:rgba(247,79,106,.15);}
#main{display:flex;flex:1;overflow:hidden;}
#sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sidebar-section{border-bottom:1px solid var(--border);padding-bottom:6px;}
.sidebar-title{padding:10px 12px 6px;font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;}
.sidebar-add{display:flex;align-items:center;gap:7px;padding:6px 12px;font-size:11px;cursor:pointer;color:var(--text2);transition:all .12s;background:none;border:none;font-family:'JetBrains Mono',monospace;width:100%;text-align:left;}
.sidebar-add:hover{color:var(--text);background:var(--bg3);}
.sidebar-add .ico{font-size:13px;}
.sidebar-info{padding:8px 12px;font-size:10px;color:var(--text3);line-height:1.7;}
.sidebar-info b{color:var(--text2);}
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;background-position:-1px -1px;}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;}
#canvas-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;transform-origin:0 0;}
.zoom-info{position:absolute;bottom:12px;right:14px;font-size:10px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);padding:3px 8px;border-radius:4px;}
#canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
#canvas-hint h2{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--border2);margin-bottom:6px;}
#canvas-hint p{font-size:11px;color:var(--text3);}
/* NODES */
.node{position:absolute;border-radius:8px;border:1.5px solid var(--border2);background:var(--bg2);min-width:200px;cursor:grab;transition:border-color .15s,box-shadow .15s;}
.node:hover,.node.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,142,247,.2),0 6px 24px var(--shadow);}
.node.dragging{cursor:grabbing;z-index:1000;}
.node-header{padding:8px 10px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border);}
.node-header-icon{font-size:12px;flex-shrink:0;}
.node-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;flex:1;cursor:text;outline:none;background:transparent;border:none;color:inherit;caret-color:var(--accent);min-width:60px;}
.node-title:focus{background:rgba(255,255,255,.05);border-radius:3px;padding:1px 3px;}
.node-del{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--text3);transition:all .12s;background:transparent;border:none;flex-shrink:0;}
.node-del:hover{background:rgba(247,79,106,.2);color:var(--red);}
.node-body{padding:6px 0 5px;}
.add-row-btn{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:10px;color:var(--text3);cursor:pointer;transition:color .12s;background:none;border:none;font-family:'JetBrains Mono',monospace;width:100%;}
.add-row-btn:hover{color:var(--accent);}
/* RELATIONAL */
.node[data-type="relational"]{border-color:rgba(79,142,247,.35);}
.node[data-type="relational"] .node-header{background:rgba(79,142,247,.1);color:var(--clr-relational);}
.col-row{display:flex;align-items:center;padding:3px 10px 3px 8px;gap:5px;font-size:10.5px;transition:background .1s;}
.col-row:hover{background:rgba(255,255,255,.03);}
.col-badge{font-size:8px;font-weight:700;width:16px;text-align:center;flex-shrink:0;padding:1px 2px;border-radius:2px;}
.col-pk{color:var(--yellow);background:rgba(247,200,79,.12);}
.col-fk{color:var(--orange);background:rgba(247,140,79,.12);}
.col-empty{width:16px;flex-shrink:0;}
.col-name{flex:1;color:var(--text);}
.col-type{color:var(--text3);font-size:9.5px;background:var(--bg3);padding:1px 5px;border-radius:3px;}
.col-nn{color:var(--red);font-size:9px;flex-shrink:0;}
.conn-dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);border:2px solid var(--accent);cursor:crosshair;flex-shrink:0;transition:transform .12s,background .12s;}
.conn-dot:hover{transform:scale(1.5);}
/* DOCUMENT */
.node[data-type="document"]{border-color:rgba(61,232,160,.35);}
.node[data-type="document"] .node-header{background:rgba(61,232,160,.1);color:var(--clr-document);}
.doc-field{display:flex;align-items:center;padding:2px 10px;font-size:10.5px;gap:6px;}
.doc-key{color:var(--clr-document);min-width:70px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-type{font-size:9.5px;padding:1px 5px;background:var(--bg3);border-radius:3px;color:var(--text3);}
.doc-badge{font-size:8px;padding:1px 4px;border-radius:2px;background:rgba(61,232,160,.12);color:var(--clr-document);}
/* GRAPH */
.node[data-type="graph-node"]{border-color:rgba(176,79,247,.35);min-width:170px;}
.node[data-type="graph-node"] .node-header{background:rgba(176,79,247,.1);color:var(--clr-graph);}
.node[data-type="graph-edge"]{border-color:rgba(247,200,79,.35);min-width:170px;}
.node[data-type="graph-edge"] .node-header{background:rgba(247,200,79,.1);color:var(--clr-keyvalue);}
.prop-row{display:flex;align-items:center;gap:6px;padding:2px 10px;font-size:10.5px;}
.prop-key{color:var(--purple);min-width:65px;}
.prop-type{font-size:9.5px;color:var(--text3);background:var(--bg3);padding:1px 5px;border-radius:3px;}
.graph-dir-badge{font-size:9px;padding:2px 7px;border-radius:10px;background:rgba(247,200,79,.1);color:var(--clr-keyvalue);margin:0 10px 6px;display:inline-block;}
/* KEY-VALUE */
.node[data-type="keyvalue"]{border-color:rgba(247,200,79,.35);}
.node[data-type="keyvalue"] .node-header{background:rgba(247,200,79,.1);color:var(--clr-keyvalue);}
.kv-row{display:flex;gap:6px;padding:3px 10px;font-size:10.5px;align-items:center;}
.kv-pattern{color:var(--yellow);font-style:italic;flex:1;font-size:10px;}
.kv-type{font-size:9.5px;padding:1px 6px;border-radius:3px;background:rgba(247,200,79,.1);color:var(--clr-keyvalue);flex-shrink:0;}
.kv-ttl{font-size:9px;color:var(--text3);flex-shrink:0;}
/* TIME-SERIES */
.node[data-type="timeseries"]{border-color:rgba(247,79,106,.35);}
.node[data-type="timeseries"] .node-header{background:rgba(247,79,106,.1);color:var(--clr-timeseries);}
.ts-section{padding:4px 10px 1px;font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
.ts-row{display:flex;align-items:center;gap:6px;padding:2px 10px;font-size:10.5px;}
.ts-icon{font-size:9px;width:12px;text-align:center;flex-shrink:0;}
.ts-name{flex:1;color:var(--text2);}
.ts-type{font-size:9.5px;color:var(--text3);background:var(--bg3);padding:1px 5px;border-radius:3px;}
.ts-retention{padding:3px 10px 0;font-size:9px;color:rgba(247,79,106,.6);}
/* COLUMN-FAMILY */
.node[data-type="column"]{border-color:rgba(79,240,247,.35);}
.node[data-type="column"] .node-header{background:rgba(79,240,247,.1);color:var(--clr-column);}
.cf-pk-section{background:rgba(79,240,247,.05);border-bottom:1px solid var(--border);padding:4px 10px 6px;}
.cf-pk-label{font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.cf-col-row{display:flex;align-items:center;gap:6px;padding:2px 10px;font-size:10.5px;}
.cf-col-name{flex:1;color:var(--cyan);}
.cf-col-type{font-size:9.5px;color:var(--text3);background:var(--bg3);padding:1px 5px;border-radius:3px;}
.cf-pk-key{color:var(--cyan);font-weight:700;}
.cf-cluster-label{font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:4px 10px 1px;}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;min-width:420px;max-width:700px;width:92%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.modal-header h2{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;flex:1;}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.modal textarea{width:100%;height:260px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:12px;resize:vertical;outline:none;line-height:1.5;}
.modal textarea:focus{border-color:var(--accent);}
.modal-tabs{display:flex;gap:2px;margin-bottom:12px;flex-wrap:wrap;}
.mtab{padding:5px 12px;font-size:11px;border-radius:4px;cursor:pointer;border:1px solid transparent;color:var(--text2);transition:all .12s;}
.mtab:hover{background:var(--bg3);}
.mtab.active{background:rgba(79,142,247,.1);border-color:var(--accent);color:var(--accent);}
.form-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.form-label{font-size:11px;color:var(--text2);min-width:100px;}
.form-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 9px;outline:none;}
.form-input:focus{border-color:var(--accent);}
select.form-input{cursor:pointer;}
.col-editor-row{display:flex;gap:5px;align-items:center;margin-bottom:5px;padding:5px 8px;background:var(--bg3);border-radius:5px;}
.col-editor-row input,.col-editor-row select{background:var(--bg4);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 6px;outline:none;}
.col-editor-row input{flex:1;min-width:50px;}
.col-editor-row select{min-width:80px;}
.col-editor-row label{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap;}
.col-editor-row input[type="checkbox"]{width:14px;height:14px;cursor:pointer;flex:none;min-width:14px;}
.msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:8px 18px;font-size:11px;color:var(--text2);z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:fadeUp .2s ease;pointer-events:none;}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.node[data-type="kv-flow"]{border-color:rgba(247,200,79,.5);min-width:180px;}
.node[data-type="kv-flow"] .node-header{background:rgba(247,200,79,.15);color:var(--clr-keyvalue);}
.node[data-type="ts-task"]{border-color:rgba(247,79,106,.5);min-width:180px;}
.node[data-type="ts-task"] .node-header{background:rgba(247,79,106,.15);color:var(--clr-timeseries);}
.node[data-type="doc-index"]{border-color:rgba(61,232,160,.5);min-width:180px;}
.node[data-type="doc-index"] .node-header{background:rgba(61,232,160,.15);color:var(--clr-document);}
.node[data-type="cf-view"]{border-color:rgba(79,240,247,.5);min-width:180px;}
.node[data-type="cf-view"] .node-header{background:rgba(79,240,247,.15);color:var(--clr-column);}
.drag-handle{cursor:grab;color:var(--text3);padding:0 4px;user-select:none;font-size:13px;flex-shrink:0;}
.drag-handle:hover{color:var(--text2);}
.col-editor-row.dnd-over{border:1.5px dashed var(--accent);background:rgba(79,142,247,.08);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:7px 16px;border-radius:6px;font-size:11px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
/* ref/flow relation lines */
.rel-line-doc{stroke:rgba(61,232,160,.7);stroke-width:1.5px;fill:none;cursor:pointer;}
.rel-line-doc:hover{stroke:var(--green);}
.rel-line-ts{stroke:rgba(247,79,106,.7);stroke-width:1.5px;stroke-dasharray:6,3;fill:none;cursor:pointer;}
.rel-line-cf{stroke:rgba(79,240,247,.6);stroke-width:1.5px;stroke-dasharray:4,3;fill:none;}
.rel-line{stroke:rgba(79,142,247,.6);stroke-width:1.5px;fill:none;cursor:pointer;}
.rel-line:hover{stroke:var(--accent);}
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">DB<span>Architect</span></div>
  <div class="top-sep"></div>
  <a href="index.html" style="padding:4px 11px;font-size:10.5px;font-family:'JetBrains Mono',monospace;border-radius:5px;border:1px solid var(--border2);background:var(--bg3);color:var(--text3);text-decoration:none;white-space:nowrap;transition:all .15s;" onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--accent)'" onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border2)'" title="Startseite">⌂ Start</a>
  <a href="project-architect.html" style="padding:4px 11px;font-size:10.5px;font-family:'JetBrains Mono',monospace;border-radius:5px;border:1px solid var(--border2);background:var(--bg3);color:var(--text3);text-decoration:none;white-space:nowrap;transition:all .15s;" onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--accent)'" onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border2)'" title="Beide Dateien müssen im selben Ordner liegen">◈ Project Architect</a>
  <div class="top-sep"></div>
  <div class="dbtype-tabs">
    <div class="dbtab active" data-type="relational">▦ Relational</div>
    <div class="dbtab" data-type="document">◎ Document</div>
    <div class="dbtab" data-type="graph">⬡ Graph</div>
    <div class="dbtab" data-type="keyvalue">⌗ Key-Value</div>
    <div class="dbtab" data-type="timeseries">~ Time-Series</div>
    <div class="dbtab" data-type="column">≡ Column-Family</div>
  </div>
  <div class="top-sep"></div>
  <div class="top-actions">
    <button class="btn-theme" id="btn-theme" onclick="toggleTheme()" title="Hell/Dunkel">🌙</button>
    <div class="top-sep"></div>

<script>
// ── STATE ──────────────────────────────────────────────
var state = { dbType:'relational', nodes:[], relations:[], nextId:1 };
var canvas, canvasSvg, canvasWrap;
var scale=1, panX=0, panY=0;
var isDragging=false, dragNode=null, dragOffX=0, dragOffY=0;
var isPanning=false, panStartX=0, panStartY=0, panStartPanX=0, panStartPanY=0;
var connectingFrom=null;
// ── UNDO / REDO ───────────────────────────────────────
var _demoMode=false;
var undoStack=[], redoStack=[];
function snapshot(label){
  if(_demoMode)return;
  var snap={label:label||'Aktion',nodes:JSON.parse(JSON.stringify(state.nodes)),relations:JSON.parse(JSON.stringify(state.relations)),nextId:state.nextId};
  undoStack.push(snap);
  if(undoStack.length>20)undoStack.shift();
  redoStack=[];
  updateUndoButtons();
}
function undo(){
  if(!undoStack.length)return;
  var cur={nodes:JSON.parse(JSON.stringify(state.nodes)),relations:JSON.parse(JSON.stringify(state.relations)),nextId:state.nextId};
  redoStack.push(cur);
  var snap=undoStack.pop();
  applySnapshot(snap);
  updateUndoButtons();
  showMsg('Rückgängig: '+snap.label);
}
function redo(){
  if(!redoStack.length)return;
  var cur={nodes:JSON.parse(JSON.stringify(state.nodes)),relations:JSON.parse(JSON.stringify(state.relations)),nextId:state.nextId};
  undoStack.push(cur);
  var snap=redoStack.pop();
  applySnapshot(snap);
  updateUndoButtons();
  showMsg('Wiederholt');
}
function applySnapshot(snap){
  state.nodes=snap.nodes; state.relations=snap.relations; state.nextId=snap.nextId;
  canvas.querySelectorAll('.node').forEach(function(n){n.remove();});
  canvasSvg.innerHTML='';
  state.nodes.forEach(function(n){renderNode(n);});
  drawRelations(); updateHint(); refreshCodePanel();
}
function updateUndoButtons(){
  var ub=document.getElementById('btn-undo'), rb=document.getElementById('btn-redo');
  if(ub){ub.disabled=!undoStack.length;ub.style.opacity=undoStack.length?'1':'0.35';}
  if(rb){rb.disabled=!redoStack.length;rb.style.opacity=redoStack.length?'1':'0.35';}
  // show last undo label
  if(ub&&undoStack.length) ub.title='Rückgängig: '+undoStack[undoStack.length-1].label;
  else if(ub) ub.title='Nichts rückgängig zu machen';
}

// Base types without params — params added separately in UI
const SQL_TYPES=['INT','BIGINT','SMALLINT','TINYINT','SERIAL','VARCHAR','TEXT','CHAR','BOOLEAN','FLOAT','DOUBLE','DECIMAL','DATE','DATETIME','TIMESTAMP','JSON','JSONB','UUID','BLOB','BYTEA','ENUM','ARRAY'];
const SQL_PARAMS={'VARCHAR':'255','CHAR':'1','DECIMAL':'10,2','ENUM':'value1,value2','ARRAY':''};
// Parse "VARCHAR(255)" → {base:'VARCHAR', param:'255'}
function parseType(t){var m=(t||'').match(/^([A-Z0-9_]+)\(([^)]*)\)$/i);return m?{base:m[1].toUpperCase(),param:m[2]}:{base:(t||'').toUpperCase(),param:''};}
// Format back: "VARCHAR" + "255" → "VARCHAR(255)"
function formatType(base,param){base=(base||'').toUpperCase();if(param&&param.trim()){return base+'('+param.trim()+')';}return base;}
const DOC_TYPES=['String','Number','Boolean','Date','ObjectId','Array','Object','Buffer','Mixed','Decimal128'];
const PROP_TYPES=['String','Integer','Float','Boolean','Date','List','Map','Point'];
const KV_TYPES=['String','Hash','List','Set','Sorted Set','Stream','HyperLogLog','Bitmap'];
const TS_TYPES=['float','integer','boolean','string','unsigned'];
const CF_TYPES=['text','int','bigint','boolean','float','double','decimal','timestamp','uuid','blob','list<text>','map<text,text>','set<text>','counter','frozen<text>'];
const CF_PARAM_TYPES=['list','map','set','frozen','decimal','varchar'];// types that accept inline params already in angle brackets
const REF_TYPES=['$ref (Referenced)','Embedded','DBRef','Array of Refs'];
const FLOW_TYPES=['reads','writes','caches','invalidates','pub/sub','pipeline'];
const AGG_TYPES=['mean','sum','count','max','min','last','median','percentile'];

const SIDEBAR_CFG = {
  relational:{
    items:[{label:'Tabelle hinzufügen',icon:'▦',sub:'table'}],
    legend:'<b>PK</b> = Primary Key<br><b>FK</b> = Foreign Key<br><b>NN</b> = Not Null<br><br>Punkt ziehen = Beziehung<br>PostgreSQL / MySQL / SQLite'
  },
  document:{
    items:[
      {label:'Collection hinzufügen',icon:'◎',sub:'collection'},
      {label:'Index hinzufügen',icon:'⊡',sub:'doc-index'},
    ],
    legend:'<b>_id</b> = ObjectId (PK)<br><b>*</b> = Required<br><b>$ref</b> = Referenz auf andere Collection<br><b>Index</b> = Separates Index-Objekt<br><br>Pfeile = Referenz-Richtung<br>MongoDB / Firestore / CouchDB'
  },
  graph:{
    items:[{label:'Node (Label)',icon:'●',sub:'graph-node'},{label:'Relationship (Edge)',icon:'↔',sub:'graph-edge'}],
    legend:'<b>Node</b> = Entität<br><b>Edge</b> = Beziehung<br><br>Neo4j / ArangoDB / TigerGraph'
  },
  keyvalue:{
    items:[
      {label:'Namespace hinzufügen',icon:'⌗',sub:'namespace'},
      {label:'Datenfluss hinzufügen',icon:'→',sub:'kv-flow'},
    ],
    legend:'<b>Pattern</b> = Key-Muster<br><b>Typ</b> = Redis-Struktur<br><b>TTL</b> = Ablaufzeit<br><b>→ Fluss</b> = Datenfluss zw. Namespaces<br><br>Redis / DragonflyDB / KeyDB'
  },
  timeseries:{
    items:[
      {label:'Measurement hinzufügen',icon:'~',sub:'measurement'},
      {label:'Downsampling-Task',icon:'↓',sub:'ts-task'},
    ],
    legend:'<b>Tag</b> = Indexed Label<br><b>Field</b> = Messwert<br><b>Retention</b> = Aufbewahrung<br><b>Task</b> = Aggregations-Job<br><br>InfluxDB / TimescaleDB'
  },
  column:{
    items:[
      {label:'Tabelle hinzufügen',icon:'≡',sub:'column'},
      {label:'Materialized View',icon:'◈',sub:'cf-view'},
    ],
    legend:'<b>PK</b> = Partition Key<br><b>CK</b> = Clustering Key<br><b>View</b> = Materialized View (Query-optimiert)<br><br>Cassandra / ScyllaDB'
  }
};

// ── INIT ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  canvas = document.getElementById('canvas');
  canvasSvg = document.getElementById('canvas-svg');
  canvasWrap = document.getElementById('canvas-wrap');
  setupTabs();
  updateSidebar();
  setupCanvasEvents();
  setupCodePanel();
  updateUndoButtons();
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();undo();}
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redo();}
  });
  var _restored=loadFromStorage();
  if(_restored){
    setTimeout(function(){showToast('Letzter Stand wiederhergestellt');},300);
  } else {
    setTimeout(loadDemo, 80);
  }
});

function setupTabs() {
  document.querySelectorAll('.dbtab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.dbtab').forEach(function(t){t.classList.remove('active');});
      tab.classList.add('active');
      state.dbType = tab.dataset.type;
      activeCodeTab='';
      updateSidebar();
      refreshCodePanel();
    });
  });
}

function updateSidebar() {
  var cfg = SIDEBAR_CFG[state.dbType];
  var html = '<div class="sidebar-title">Elemente</div>';
  cfg.items.forEach(function(item) {
    html += '<button class="sidebar-add" onclick="addNode(\''+state.dbType+'\',\''+item.sub+'\')"><span class="ico">'+item.icon+'</span>'+item.label+'</button>';
  });
  document.getElementById('sidebar-content').innerHTML = html;
  document.getElementById('sidebar-legend').innerHTML = cfg.legend;
}

// ── NODE FACTORY ──────────────────────────────────────
function addNode(dbType, subtype) {
  snapshot('Element hinzufügen');
  var id = 'node_'+(state.nextId++);
  var cx = (canvasWrap.clientWidth/2 - panX)/scale - 100 + (Math.random()-0.5)*100;
  var cy = (canvasWrap.clientHeight/2 - panY)/scale - 80 + (Math.random()-0.5)*60;
  var node = {id:id, type:dbType, subtype:subtype, x:cx, y:cy, data:getDefaultData(dbType,subtype)};
  state.nodes.push(node);
  renderNode(node);
  updateHint();
  return node;
}

function getDefaultData(dbType, subtype) {
  if (subtype==='table') return {title:'neue_tabelle',columns:[
    {name:'id',type:'INT',pk:true,fk:false,nn:true},
    {name:'name',type:'VARCHAR(255)',pk:false,fk:false,nn:true},
    {name:'created_at',type:'TIMESTAMP',pk:false,fk:false,nn:false}
  ]};
  if (subtype==='collection') return {title:'collection',fields:[
    {key:'_id',type:'ObjectId',required:true,badge:'PK'},
    {key:'name',type:'String',required:true},
    {key:'email',type:'String',required:false},
    {key:'metadata',type:'Object',required:false,nested:[
      {key:'createdAt',type:'Date'},{key:'tags',type:'Array'}
    ]}
  ]};
  if (subtype==='graph-node') return {title:'Person',props:[
    {name:'id',type:'Integer'},{name:'name',type:'String'},{name:'age',type:'Integer'}
  ]};
  if (subtype==='graph-edge') return {title:'KNOWS',directed:true,props:[
    {name:'since',type:'Date'},{name:'weight',type:'Float'}
  ]};
  if (subtype==='namespace') return {title:'user',keys:[
    {pattern:'user:{id}:profile',type:'Hash',ttl:'—'},
    {pattern:'user:{id}:sessions',type:'List',ttl:'24h'},
    {pattern:'session:{token}',type:'String',ttl:'1h'}
  ]};
  if (subtype==='kv-flow') return {title:'Cache Flow',from:'cache',to:'user',type:'reads',label:'HGET user:{id}:profile'};
  if (subtype==='measurement') return {title:'cpu_usage',retention:'30d',
    tags:[{name:'host'},{name:'region'}],
    fields:[{name:'usage_percent',type:'float'},{name:'load_avg',type:'float'}]
  };
  if (subtype==='ts-task') return {title:'cpu_5m_avg',every:'5m',offset:'0s',from:'cpu_usage',to:'cpu_downsampled',retention:'1y',
    aggregations:[{field:'usage_percent',fn:'mean'},{field:'load_avg',fn:'mean'}]
  };
  if (subtype==='column') return {title:'events',
    partitionKeys:[{name:'user_id',type:'uuid'}],
    clusteringKeys:[{name:'event_time',type:'timestamp',order:'DESC'}],
    columns:[{name:'event_type',type:'text'},{name:'payload',type:'blob'}]
  };
  if (subtype==='cf-view') return {title:'events_by_type',baseTable:'events',
    partitionKeys:[{name:'event_type',type:'text'}],
    clusteringKeys:[{name:'event_time',type:'timestamp',order:'DESC'}],
    columns:[{name:'user_id',type:'uuid'},{name:'payload',type:'blob'}]
  };
  if (subtype==='doc-index') return {title:'users_email_idx',collection:'users',
    fields:[{key:'email',direction:1,unique:true},{key:'createdAt',direction:-1,unique:false}],
    sparse:false,background:true
  };
  return {title:subtype};
}

// ── RENDER ────────────────────────────────────────────
function renderNode(node) {
  var old = document.getElementById(node.id);
  if (old) old.remove();
  var el = document.createElement('div');
  el.className='node'; el.id=node.id;
  el.dataset.type=node.subtype;
  el.style.left=node.x+'px'; el.style.top=node.y+'px';
  el.innerHTML = buildNodeHTML(node);
  canvas.appendChild(el);

  el.addEventListener('mousedown', function(e) {
    if (e.target.closest('input,select,button,.conn-dot')) return;
    isDragging=true; dragNode=node;
    el.classList.add('dragging');
    var r=el.getBoundingClientRect();
    dragOffX=e.clientX-r.left; dragOffY=e.clientY-r.top;
    deselectAll(); el.classList.add('selected');
    e.preventDefault();
  });

  el.querySelectorAll('.node-title').forEach(function(inp) {
    inp.addEventListener('input',function(){node.data.title=inp.value;});
    inp.addEventListener('mousedown',function(e){e.stopPropagation();});
    inp.addEventListener('keydown',function(e){e.stopPropagation();});
  });

  el.querySelectorAll('.conn-dot').forEach(function(dot) {
    dot.addEventListener('mousedown', function(e) {
      e.stopPropagation();
      var colName=dot.dataset.col;
      if (connectingFrom) {
        if (connectingFrom.nodeId!==node.id) {
          addRelation(connectingFrom.nodeId,connectingFrom.colName,node.id,colName);
        }
        connectingFrom.dotEl.style.background='';
        connectingFrom=null; clearTempLine();
      } else {
        connectingFrom={nodeId:node.id,colName:colName,dotEl:dot};
        dot.style.background='var(--green)';
      }
    });
  });
}

function buildNodeHTML(node) {
  var d=node.data, icon='▦', body='';
  if (node.subtype==='table') {
    icon='▦';
    body=d.columns.map(function(col){
      var badge=col.pk?'<span class="col-badge col-pk">PK</span>':
                col.fk?'<span class="col-badge col-fk">FK</span>':
                       '<span class="col-empty"></span>';
      return '<div class="col-row">'+badge+
        '<span class="col-name">'+esc(col.name)+'</span>'+
        '<span class="col-type">'+esc(col.type)+'</span>'+
        (col.nn?'<span class="col-nn">NN</span>':'')+
        '<span class="conn-dot" data-col="'+esc(col.name)+'" title="Verbindung ziehen"></span>'+
        '</div>';
    }).join('')+'<button class="add-row-btn" onclick="editNode(\''+node.id+'\')">+ Spalte / bearbeiten</button>';
  } else if (node.subtype==='collection') {
    icon='◎';
    body=renderDocFields(d.fields)+'<button class="add-row-btn" onclick="editNode(\''+node.id+'\')">+ Feld / bearbeiten</button>';
  } else if (node.subtype==='graph-node') {
    icon='●';
    body=d.props.map(function(p){return '<div class="prop-row"><span class="prop-key">'+esc(p.name)+'</span><span class="prop-type">'+esc(p.type)+'</span></div>';}).join('')+
      '<button class="add-row-btn" onclick="editNode(\''+node.id+'\')">+ Property / bearbeiten</button>';
  } else if (node.subtype==='graph-edge') {
    icon='↔';
    // collect available node labels for display
    var fromLabel=d.fromLabel||'?', toLabel=d.toLabel||'?';
    var arrow=d.directed
      ? '<span style="color:var(--clr-graph);font-weight:700">('+esc(fromLabel)+')</span><span style="color:var(--text3);margin:0 4px">──→</span><span style="color:var(--clr-graph);font-weight:700">('+esc(toLabel)+')</span>'
      : '<span style="color:var(--clr-graph);font-weight:700">('+esc(fromLabel)+')</span><span style="color:var(--text3);margin:0 4px">───</span><span style="color:var(--clr-graph);font-weight:700">('+esc(toLabel)+')</span>';
    body='<div style="padding:5px 10px 4px;display:flex;align-items:center;gap:4px;font-size:10.5px;border-bottom:1px solid var(--border);background:rgba(176,79,247,.05)">'+arrow+'</div>'+
      d.props.map(function(p){return '<div class="prop-row"><span class="prop-key">'+esc(p.name)+'</span><span class="prop-type">'+esc(p.type)+'</span></div>';}).join('')+
      '<button class="add-row-btn" onclick="editNode(\''+node.id+'\')">+ Property / bearbeiten</button>';
  } else if (node.subtype==='namespace') {
    icon='⌗';
    body=d.keys.map(function(k){return '<div class="kv-row"><span class="kv-pattern">'+esc(k.pattern)+'</span><span class="kv-type">'+esc(k.type)+'</span><span class="kv-ttl">'+esc(k.ttl)+'</span></div>';}).join('')+
      '<button class="add-row-btn" onclick="editNode(\''+node.id+'\')">+ Key Pattern / bearbeiten</button>';
  } else if (node.subtype==='kv-flow') {
    icon='→';
    body='<div style="padding:4px 10px 3px;font-size:10px;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--border)">'+
      '<span style="color:var(--clr-keyvalue);font-weight:700">'+esc(d.from||'?')+'</span>'+
      '<span style="color:var(--text3)"> '+esc(d.type||'→')+' </span>'+
      '<span style="color:var(--clr-keyvalue);font-weight:700">'+esc(d.to||'?')+'</span></div>'+
      '<div style="padding:3px 10px;font-size:10px;color:var(--text3);font-style:italic">'+esc(d.label||'')+'</div>'+
      '<button class="add-row-btn" onclick="editNode(\''+node.id+'\')">bearbeiten</button>';
  } else if (node.subtype==='measurement') {
    icon='~';
    body='<div class="ts-retention">retention: '+esc(d.retention)+'</div>'+
      '<div class="ts-section">Tags</div>'+
      d.tags.map(function(t){return '<div class="ts-row"><span class="ts-icon" style="color:var(--red)">T</span><span class="ts-name">'+esc(t.name)+'</span><span class="ts-type">string</span></div>';}).join('')+
      '<div class="ts-section">Fields</div>'+
      d.fields.map(function(f){return '<div class="ts-row"><span class="ts-icon" style="color:var(--text3)">F</span><span class="ts-name">'+esc(f.name)+'</span><span class="ts-type">'+esc(f.type)+'</span></div>';}).join('')+
      '<button class="add-row-btn" onclick="editNode(\''+node.id+'\')">+ Tag/Field / bearbeiten</button>';
  } else if (node.subtype==='ts-task') {
    icon='↓';
    body='<div style="padding:3px 10px 0;font-size:10px;border-bottom:1px solid var(--border);padding-bottom:5px">'+
      '<span style="color:var(--clr-timeseries)">'+esc(d.from||'?')+'</span>'+
      '<span style="color:var(--text3)"> → </span>'+
      '<span style="color:var(--clr-timeseries)">'+esc(d.to||'?')+'</span></div>'+
      '<div class="ts-section">Aggregations</div>'+
      (d.aggregations||[]).map(function(a){return '<div class="ts-row"><span class="ts-icon" style="color:var(--clr-timeseries)">∑</span><span class="ts-name">'+esc(a.field)+'</span><span class="ts-type">'+esc(a.fn)+'</span></div>';}).join('')+
      '<div style="padding:3px 10px;font-size:9px;color:var(--text3)">every '+esc(d.every||'5m')+' · retention '+esc(d.retention||'∞')+'</div>'+
      '<button class="add-row-btn" onclick="editNode(\''+node.id+'\')">bearbeiten</button>';
  } else if (node.subtype==='doc-index') {
    icon='⊡';
    body='<div style="padding:2px 10px 4px;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">on: <span style="color:var(--clr-document)">'+esc(d.collection||'?')+'</span>'+
      (d.sparse?' · sparse':'')+(d.background?' · background':'')+'</div>'+
      (d.fields||[]).map(function(f){return '<div class="doc-field"><span class="doc-key">'+esc(f.key)+'</span>'+
        '<span class="doc-type">'+(f.direction===1?'ASC':'DESC')+'</span>'+
        (f.unique?'<span class="doc-badge">UNIQUE</span>':'')+'</div>';}).join('')+
      '<button class="add-row-btn" onclick="editNode(\''+node.id+'\')">bearbeiten</button>';
  } else if (node.subtype==='column') {
    icon='≡';
    body='<div class="cf-pk-section"><div class="cf-pk-label">Partition Key</div>'+
      d.partitionKeys.map(function(k){return '<div class="cf-col-row"><span class="cf-col-name cf-pk-key">'+esc(k.name)+'</span><span class="cf-col-type">'+esc(k.type)+'</span></div>';}).join('')+
      '</div>';
    if (d.clusteringKeys.length) body+='<div class="cf-cluster-label">Clustering Key</div>'+
      d.clusteringKeys.map(function(k){return '<div class="cf-col-row"><span class="cf-col-name" style="color:var(--cyan);opacity:.7">'+esc(k.name)+'</span><span class="cf-col-type">'+esc(k.type)+'</span><span class="cf-col-type" style="color:var(--clr-timeseries)">'+esc(k.order)+'</span></div>';}).join('');
    body+='<div style="border-top:1px solid var(--border);margin-top:3px;padding-top:2px">'+
      d.columns.map(function(c){return '<div class="cf-col-row"><span class="cf-col-name">'+esc(c.name)+'</span><span class="cf-col-type">'+esc(c.type)+'</span></div>';}).join('')+
      '</div><button class="add-row-btn" onclick="editNode(\''+node.id+'\')">+ Spalte / bearbeiten</button>';
  } else if (node.subtype==='cf-view') {
    icon='◈';
    body='<div style="padding:3px 10px 4px;font-size:10px;border-bottom:1px solid var(--border)">'+
      'VIEW OF: <span style="color:var(--clr-column);font-weight:700">'+esc(d.baseTable||'?')+'</span></div>'+
      '<div class="cf-pk-section"><div class="cf-pk-label">Partition Key</div>'+
      (d.partitionKeys||[]).map(function(k){return '<div class="cf-col-row"><span class="cf-col-name cf-pk-key">'+esc(k.name)+'</span><span class="cf-col-type">'+esc(k.type)+'</span></div>';}).join('')+
      '</div>'+
      '<div style="border-top:1px solid var(--border);margin-top:3px;padding-top:2px">'+
      (d.columns||[]).map(function(c){return '<div class="cf-col-row"><span class="cf-col-name">'+esc(c.name)+'</span><span class="cf-col-type">'+esc(c.type)+'</span></div>';}).join('')+
      '</div><button class="add-row-btn" onclick="editNode(\''+node.id+'\')">bearbeiten</button>';
  }

  return '<div class="node-header"><span class="node-header-icon">'+icon+'</span>'+
    '<input class="node-title" value="'+esc(d.title)+'" spellcheck="false">'+
    '<button class="node-del" onclick="deleteNode(\''+node.id+'\')">✕</button></div>'+
    '<div class="node-body">'+body+'</div>';
}

function renderDocFields(fields, indent) {
  indent=indent||0;
  return fields.map(function(f){
    var html='<div class="doc-field" style="padding-left:'+(10+indent*14)+'px">'+
      '<span class="doc-key">'+esc(f.key)+'</span>'+
      '<span class="doc-type">'+esc(f.type)+'</span>'+
      (f.badge?'<span class="doc-badge">'+esc(f.badge)+'</span>':'')+
      (f.required?'<span style="color:var(--red);font-size:9px">*</span>':'')+
      '</div>';
    if (f.nested&&f.nested.length) html+=renderDocFields(f.nested,indent+1);
    return html;
  }).join('');
}

// ── RELATIONS ─────────────────────────────────────────
function addRelation(fromId,fromCol,toId,toCol) {
  snapshot('Verbindung erstellen');
  state.relations.push({id:'rel_'+(state.nextId++),fromNodeId:fromId,fromCol:fromCol,toNodeId:toId,toCol:toCol});
  drawRelations();
  refreshCodePanel();
  showMsg('Verbindung erstellt');
}

function drawRelations() {
  canvasSvg.innerHTML='';
  var defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML=
    '<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="rgba(79,142,247,.9)"/></marker>'+
    '<marker id="arr-graph-to" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="rgba(176,79,247,1)"/></marker>'+
    '<marker id="arr-doc" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="rgba(61,232,160,.9)"/></marker>'+
    '<marker id="arr-ts" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="rgba(247,79,106,.9)"/></marker>'+
    '<marker id="arr-cf" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="rgba(79,240,247,.9)"/></marker>';
  canvasSvg.appendChild(defs);

  state.relations.forEach(function(rel) {
    var fromEl=document.getElementById(rel.fromNodeId);
    var toEl=document.getElementById(rel.toNodeId);
    if (!fromEl||!toEl) return;

    if(rel.docRef){
      var fpc=getNodeCenter(fromEl), tpc=getNodeCenter(toEl);
      var fpb=getNodeBorderPoint(fromEl,tpc.x,tpc.y), tpb=getNodeBorderPoint(toEl,fpc.x,fpc.y);
      var pr=document.createElementNS('http://www.w3.org/2000/svg','path');
      var ddx=(tpb.x-fpb.x)*0.4;
      pr.setAttribute('d','M'+fpb.x+','+fpb.y+' C'+(fpb.x+ddx)+','+fpb.y+' '+(tpb.x-ddx)+','+tpb.y+' '+tpb.x+','+tpb.y);
      pr.setAttribute('fill','none'); pr.setAttribute('stroke','rgba(61,232,160,.7)'); pr.setAttribute('stroke-width','1.8');
      pr.setAttribute('stroke-dasharray','6,3'); pr.setAttribute('marker-end','url(#arr-doc)');
      pr.style.pointerEvents='stroke';pr.style.cursor='pointer';
      pr.addEventListener('click',(function(r){return function(){if(confirm('Verbindung löschen?')){snapshot('Verbindung löschen');state.relations=state.relations.filter(function(x){return x.id!==r.id;});drawRelations();refreshCodePanel();}};})(rel));
      canvasSvg.appendChild(pr); return;
    }
    if(rel.tsLink){
      var fpt=getNodeCenter(fromEl), tpt=getNodeCenter(toEl);
      var fpbt=getNodeBorderPoint(fromEl,tpt.x,tpt.y), tpbt=getNodeBorderPoint(toEl,fpt.x,fpt.y);
      var pt=document.createElementNS('http://www.w3.org/2000/svg','path');
      var dtx=(tpbt.x-fpbt.x)*0.4, dty=(tpbt.y-fpbt.y)*0.4;
      pt.setAttribute('d','M'+fpbt.x+','+fpbt.y+' C'+(fpbt.x+dtx)+','+(fpbt.y+dty)+' '+(tpbt.x-dtx)+','+(tpbt.y-dty)+' '+tpbt.x+','+tpbt.y);
      pt.setAttribute('fill','none'); pt.setAttribute('stroke',rel.isTo?'rgba(247,79,106,.85)':'rgba(247,79,106,.4)');
      pt.setAttribute('stroke-width','1.8'); pt.setAttribute('stroke-dasharray',rel.isTo?'none':'5,3');
      if(rel.isTo) pt.setAttribute('marker-end','url(#arr-ts)');
      pt.style.pointerEvents='stroke';pt.style.cursor='pointer';
      pt.addEventListener('click',(function(r){return function(){if(confirm('Verbindung löschen?')){snapshot('Verbindung löschen');state.relations=state.relations.filter(function(x){return x.id!==r.id;});drawRelations();refreshCodePanel();}};})(rel));
      canvasSvg.appendChild(pt); return;
    }
    if(rel.cfViewLink){
      var fpcf=getNodeCenter(fromEl), tpcf=getNodeCenter(toEl);
      var fpbcf=getNodeBorderPoint(fromEl,tpcf.x,tpcf.y), tpbcf=getNodeBorderPoint(toEl,fpcf.x,fpcf.y);
      var pcf=document.createElementNS('http://www.w3.org/2000/svg','path');
      var dcfx=(tpbcf.x-fpbcf.x)*0.4;
      pcf.setAttribute('d','M'+fpbcf.x+','+fpbcf.y+' C'+(fpbcf.x+dcfx)+','+fpbcf.y+' '+(tpbcf.x-dcfx)+','+tpbcf.y+' '+tpbcf.x+','+tpbcf.y);
      pcf.setAttribute('fill','none'); pcf.setAttribute('stroke','rgba(79,240,247,.65)'); pcf.setAttribute('stroke-width','1.8');
      pcf.setAttribute('stroke-dasharray','4,3'); pcf.setAttribute('marker-end','url(#arr-cf)');
      pcf.style.pointerEvents='stroke';pcf.style.cursor='pointer';
      pcf.addEventListener('click',(function(r){return function(){if(confirm('Verbindung löschen?')){snapshot('Verbindung löschen');state.relations=state.relations.filter(function(x){return x.id!==r.id;});drawRelations();refreshCodePanel();}};})(rel));
      canvasSvg.appendChild(pcf); return;
    }

    if(rel.graphLink){
      var ec=getNodeCenter(fromEl);   // edge card center
      var nc=getNodeCenter(toEl);     // node card center
      // find actual border intersection points
      var fp2=getNodeBorderPoint(fromEl, nc.x, nc.y);
      var tp2=getNodeBorderPoint(toEl,   ec.x, ec.y);
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      // slight curve
      var mdx=(tp2.x-fp2.x)*0.35, mdy=(tp2.y-fp2.y)*0.35;
      path.setAttribute('d','M'+fp2.x+','+fp2.y+' C'+(fp2.x+mdx)+','+(fp2.y+mdy)+' '+(tp2.x-mdx)+','+(tp2.y-mdy)+' '+tp2.x+','+tp2.y);
      path.setAttribute('fill','none');
      if(rel.isTo){
        path.setAttribute('stroke','rgba(176,79,247,.85)');
        path.setAttribute('stroke-width','2');
        if(rel.directed) path.setAttribute('marker-end','url(#arr-graph-to)');
      } else {
        // "from" connector: dashed, thinner
        path.setAttribute('stroke','rgba(176,79,247,.4)');
        path.setAttribute('stroke-width','1.5');
        path.setAttribute('stroke-dasharray','5,3');
      }
      path.style.pointerEvents='stroke';path.style.cursor='pointer';
      path.addEventListener('click',(function(r){return function(){if(confirm('Verbindung löschen?')){snapshot('Verbindung löschen');state.relations=state.relations.filter(function(x){return x.id!==r.id;});drawRelations();refreshCodePanel();}};})(rel));
      canvasSvg.appendChild(path);
      return;
    }

    var dot=fromEl.querySelector('.conn-dot[data-col="'+CSS.escape(rel.fromCol)+'"]');
    if (!dot) return;
    // to: try exact col dot, else first dot on the node
    var toDot=toEl.querySelector('.conn-dot[data-col="'+CSS.escape(rel.toCol)+'"]')
              ||toEl.querySelector('.conn-dot');
    var fp=getDotPos(dot);
    var tp=toDot ? getDotPos(toDot) : getNodeCenter(toEl);
    // route: exit right side of from-node, enter left side of to-node
    var fromNodeEl=fromEl;
    var toNodeEl=toEl;
    var fRight=(fromNodeEl.getBoundingClientRect().right - canvasWrap.getBoundingClientRect().left - panX)/scale;
    var tLeft=(toNodeEl.getBoundingClientRect().left   - canvasWrap.getBoundingClientRect().left - panX)/scale;
    var fx=fRight, fy=fp.y;
    var tx=tLeft,  ty=tp.y;
    var dx=Math.abs(tx-fx)*0.5;
    // shorten tx by marker size so arrowhead lands at border
    var markerLen=10/scale;
    var dirX=tx>fx?-markerLen:markerLen;
    var txAdj=tx+dirX;
    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','M'+fx+','+fy+' C'+(fx+dx)+','+fy+' '+(txAdj-dx)+','+ty+' '+txAdj+','+ty);
    path.setAttribute('class','rel-line');
    path.setAttribute('marker-end','url(#arr)');
    path.dataset.relId=rel.id;
    path.style.pointerEvents='stroke';
    path.addEventListener('click',function(){
      if(confirm('Verbindung löschen?')){
        snapshot('Verbindung löschen');
        state.relations=state.relations.filter(function(r){return r.id!==rel.id;});
        drawRelations();
        refreshCodePanel();
      }
    });
    canvasSvg.appendChild(path);
  });
}

function getDotPos(el) {
  var r=el.getBoundingClientRect(), cr=canvasWrap.getBoundingClientRect();
  return {x:(r.left+r.width/2-cr.left-panX)/scale, y:(r.top+r.height/2-cr.top-panY)/scale};
}
function getNodeCenter(el) {
  var r=el.getBoundingClientRect(), cr=canvasWrap.getBoundingClientRect();
  return {x:(r.left+r.width/2-cr.left-panX)/scale, y:(r.top+r.height/2-cr.top-panY)/scale};
}
// Returns the point on the border of el closest to (tx,ty)
function getNodeBorderPoint(el, tx, ty){
  var r=el.getBoundingClientRect(), cr=canvasWrap.getBoundingClientRect();
  var cx=(r.left+r.width/2-cr.left-panX)/scale;
  var cy=(r.top+r.height/2-cr.top-panY)/scale;
  var hw=r.width/2/scale, hh=r.height/2/scale;
  var dx=tx-cx, dy=ty-cy;
  if(dx===0&&dy===0) return {x:cx,y:cy};
  var scaleX=dx!==0?Math.abs(hw/dx):Infinity;
  var scaleY=dy!==0?Math.abs(hh/dy):Infinity;
  var s=Math.min(scaleX,scaleY);
  return {x:cx+dx*s, y:cy+dy*s};
}

var tempLine=null;
function clearTempLine(){if(tempLine){tempLine.remove();tempLine=null;}}

// ── DRAG / PAN / ZOOM ─────────────────────────────────
function setupCanvasEvents() {
  document.addEventListener('mousemove',function(e){
    if (isDragging&&dragNode) {
      var wr=canvasWrap.getBoundingClientRect();
      dragNode.x=(e.clientX-wr.left-panX-dragOffX)/scale;
      dragNode.y=(e.clientY-wr.top-panY-dragOffY)/scale;
      var el=document.getElementById(dragNode.id);
      if(el){el.style.left=dragNode.x+'px';el.style.top=dragNode.y+'px';}
      drawRelations();
    }
    if (isPanning){panX=panStartPanX+(e.clientX-panStartX);panY=panStartPanY+(e.clientY-panStartY);applyTransform();}
    if (connectingFrom){
      clearTempLine();
      var wr=canvasWrap.getBoundingClientRect();
      var mx=(e.clientX-wr.left-panX)/scale, my=(e.clientY-wr.top-panY)/scale;
      var fp=getDotPos(connectingFrom.dotEl);
      tempLine=document.createElementNS('http://www.w3.org/2000/svg','line');
      tempLine.setAttribute('x1',fp.x);tempLine.setAttribute('y1',fp.y);
      tempLine.setAttribute('x2',mx);tempLine.setAttribute('y2',my);
      tempLine.setAttribute('stroke','var(--green)');tempLine.setAttribute('stroke-width','1.5');
      tempLine.setAttribute('stroke-dasharray','5,3');
      canvasSvg.appendChild(tempLine);
    }
  });
  document.addEventListener('mouseup',function(){
    if(isDragging&&dragNode){document.getElementById(dragNode.id)&&document.getElementById(dragNode.id).classList.remove('dragging');isDragging=false;dragNode=null;}
    isPanning=false;
  });
  canvasWrap.addEventListener('mousedown',function(e){
    if(e.target===canvasWrap||e.target===canvas||e.target===canvasSvg){
      if(connectingFrom){connectingFrom.dotEl.style.background='';connectingFrom=null;clearTempLine();return;}
      isPanning=true;panStartX=e.clientX;panStartY=e.clientY;panStartPanX=panX;panStartPanY=panY;
      deselectAll();
    }
  });
  canvasWrap.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=canvasWrap.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    var d=e.deltaY>0?0.9:1.1, ns=Math.min(Math.max(scale*d,0.2),3);
    panX=mx-(mx-panX)*(ns/scale); panY=my-(my-panY)*(ns/scale); scale=ns; applyTransform();
  },{passive:false});
}

function applyTransform(){
  canvas.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
  canvasSvg.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
  document.getElementById('zoom-info').textContent=Math.round(scale*100)+'%';
}
function zoomReset(){scale=1;panX=60;panY=60;applyTransform();}
function deselectAll(){document.querySelectorAll('.node.selected').forEach(function(n){n.classList.remove('selected');});}
function deleteNode(id){
  snapshot('Element löschen');
  state.nodes=state.nodes.filter(function(n){return n.id!==id;});
  state.relations=state.relations.filter(function(r){return r.fromNodeId!==id&&r.toNodeId!==id;});
  var el=document.getElementById(id); if(el)el.remove();
  drawRelations(); updateHint(); refreshCodePanel();
}
function clearCanvas(){
  if(!confirm('Alle Elemente löschen?'))return;
  snapshot('Canvas leeren');
  state.nodes=[];state.relations=[];
  canvas.querySelectorAll('.node').forEach(function(n){n.remove();});
  canvasSvg.innerHTML=''; updateHint();
}
function updateHint(){
  var h=document.getElementById('canvas-hint');
  if(h)h.style.display=state.nodes.length?'none':'block';
}
function autoLayout(){
  if(state.dbType==='graph') { autoLayoutGraph(); return; }
  if(state.dbType==='keyvalue') { autoLayoutKV(); return; }
  autoLayoutRelational();
}

// ── KEY-VALUE: grid layout, namespaces close together ──
function autoLayoutKV(){
  var nodes=state.nodes;
  if(!nodes.length) return;
  var NS_W=210, NS_H=160, FLOW_W=200, FLOW_H=80;
  var COLS=3, GAP_X=30, GAP_Y=30;

  var namespaces=nodes.filter(function(n){return n.subtype==='namespace';});
  var flows=nodes.filter(function(n){return n.subtype==='kv-flow';});

  // grid for namespaces
  namespaces.forEach(function(n,i){
    var col=i%COLS, row=Math.floor(i/COLS);
    n.x=40+col*(NS_W+GAP_X);
    n.y=40+row*(NS_H+GAP_Y);
    var el=document.getElementById(n.id);
    if(el){el.style.left=n.x+'px';el.style.top=n.y+'px';}
  });

  // flows below namespace grid
  var nsRows=Math.ceil(namespaces.length/COLS);
  var flowStartY=40+nsRows*(NS_H+GAP_Y)+40;
  flows.forEach(function(n,i){
    n.x=40+i*(FLOW_W+GAP_X);
    n.y=flowStartY;
    var el=document.getElementById(n.id);
    if(el){el.style.left=n.x+'px';el.style.top=n.y+'px';}
  });

  drawRelations();
  var allX=nodes.map(function(n){return n.x;}), allY=nodes.map(function(n){return n.y;});
  var minX=Math.min.apply(null,allX), minY=Math.min.apply(null,allY);
  var maxX=Math.max.apply(null,nodes.map(function(n){return n.x+240;}));
  var maxY=Math.max.apply(null,nodes.map(function(n){return n.y+200;}));
  var scaleX=(canvasWrap.clientWidth-80)/(maxX-minX||1);
  var scaleY=(canvasWrap.clientHeight-80)/(maxY-minY||1);
  scale=Math.min(1, scaleX, scaleY);
  panX=40-minX*scale; panY=40-minY*scale;
  applyTransform();
}

// ── RELATIONAL: Sugiyama-style layered layout ──────────
function autoLayoutRelational(){
  var nodes=state.nodes;
  if(!nodes.length) return;
  var W=240, H=220, PAD_X=130, PAD_Y=70;

  // Build adjacency: fromNodeId → toNodeId
  var outEdges={}, inEdges={};
  nodes.forEach(function(n){ outEdges[n.id]=[]; inEdges[n.id]=[]; });
  state.relations.forEach(function(r){
    if(r.graphLink) return;
    if(outEdges[r.fromNodeId]) outEdges[r.fromNodeId].push(r.toNodeId);
    if(inEdges[r.toNodeId])    inEdges[r.toNodeId].push(r.fromNodeId);
  });

  // Assign layers via longest-path from sources
  var layer={};
  var visited={};
  function assignLayer(id, d){
    if(layer[id]===undefined || layer[id]<d) layer[id]=d;
    if(visited[id]) return; visited[id]=true;
    outEdges[id].forEach(function(tid){ assignLayer(tid, d+1); });
  }
  // sources = nodes with no incoming edges
  nodes.forEach(function(n){
    if(!inEdges[n.id]||inEdges[n.id].length===0) assignLayer(n.id,0);
  });
  // fallback for disconnected
  nodes.forEach(function(n){ if(layer[n.id]===undefined) layer[n.id]=0; });

  // Group by layer
  var layers={};
  nodes.forEach(function(n){
    var l=layer[n.id]||0;
    if(!layers[l]) layers[l]=[];
    layers[l].push(n);
  });

  // Sort each layer to minimize crossings (barycenter heuristic)
  var layerKeys=Object.keys(layers).map(Number).sort(function(a,b){return a-b;});
  layerKeys.forEach(function(l, li){
    if(li===0) return;
    var prevLayer=layers[layerKeys[li-1]];
    var prevPos={};
    prevLayer.forEach(function(n,i){ prevPos[n.id]=i; });
    layers[l].sort(function(a,b){
      var aParents=inEdges[a.id]||[], bParents=inEdges[b.id]||[];
      var aAvg=aParents.length ? aParents.reduce(function(s,p){return s+(prevPos[p]||0);},0)/aParents.length : 0;
      var bAvg=bParents.length ? bParents.reduce(function(s,p){return s+(prevPos[p]||0);},0)/bParents.length : 0;
      return aAvg-bAvg;
    });
  });

  // Position nodes
  layerKeys.forEach(function(l, li){
    var col=layers[l];
    var totalH=col.length*H + (col.length-1)*PAD_Y;
    var startY=Math.max(PAD_Y, 400/2 - totalH/2);
    col.forEach(function(n, ni){
      n.x=PAD_X + li*(W+PAD_X);
      n.y=startY + ni*(H+PAD_Y);
      var el=document.getElementById(n.id);
      if(el){el.style.left=n.x+'px'; el.style.top=n.y+'px';}
    });
  });

  // Run 3 passes of force-repulsion to spread overlapping nodes within same layer
  for(var iter=0;iter<6;iter++){
    layerKeys.forEach(function(l){
      var col=layers[l];
      for(var i=0;i<col.length-1;i++){
        var a=col[i], b=col[i+1];
        var gap=b.y-(a.y+H);
        if(gap<PAD_Y){
          var push=(PAD_Y-gap)/2;
          a.y-=push; b.y+=push;
          var ela=document.getElementById(a.id), elb=document.getElementById(b.id);
          if(ela) ela.style.top=a.y+'px';
          if(elb) elb.style.top=b.y+'px';
        }
      }
    });
  }

  drawRelations();
  // fit view
  var maxX=0, maxY=0;
  nodes.forEach(function(n){ maxX=Math.max(maxX,n.x+W); maxY=Math.max(maxY,n.y+H); });
  scale=Math.min(1, Math.min((canvasWrap.clientWidth-80)/maxX, (canvasWrap.clientHeight-80)/maxY));
  panX=40; panY=40;
  applyTransform();
}

// ── GRAPH: place nodes in circle, edges midway ─────────
function autoLayoutGraph(){
  var gnodes=state.nodes.filter(function(n){return n.subtype==='graph-node';});
  var gedges=state.nodes.filter(function(n){return n.subtype==='graph-edge';});

  var cx=600, cy=380, r=Math.max(300, gnodes.length*160);
  // Place graph-nodes in a circle
  gnodes.forEach(function(n,i){
    var angle=(2*Math.PI*i/gnodes.length) - Math.PI/2;
    n.x=cx+Math.cos(angle)*r - 85;
    n.y=cy+Math.sin(angle)*r - 60;
    var el=document.getElementById(n.id);
    if(el){el.style.left=n.x+'px';el.style.top=n.y+'px';}
  });

  // Place each edge card at midpoint between its from/to nodes + perpendicular offset
  gedges.forEach(function(e,i){
    var fl=e.data.fromLabel, tl=e.data.toLabel;
    var fn=state.nodes.find(function(n){return n.subtype==='graph-node'&&n.data.title===fl;});
    var tn=state.nodes.find(function(n){return n.subtype==='graph-node'&&n.data.title===tl;});
    var mx, my;
    if(fn&&tn&&fn.id===tn.id){
      // Self-loop: place card outward from circle center relative to the node
      var nx=fn.x+85, ny=fn.y+60;
      var outDx=nx-cx, outDy=ny-cy, outLen=Math.sqrt(outDx*outDx+outDy*outDy)||1;
      // find other self-loops on same node
      var selfLoops=gedges.filter(function(e2){return e2.data.fromLabel===fl&&e2.data.toLabel===tl;});
      var idx2=selfLoops.indexOf(e);
      mx=nx+(outDx/outLen)*(200+idx2*160);
      my=ny+(outDy/outLen)*(200+idx2*160);
    } else if(fn&&tn){
      mx=(fn.x+85+tn.x+85)/2; my=(fn.y+60+tn.y+60)/2;
      var dx=tn.x-fn.x, dy=tn.y-fn.y, len=Math.sqrt(dx*dx+dy*dy)||1;
      var perp={x:-dy/len, y:dx/len};
      var sameEdges=gedges.filter(function(e2){
        return (e2.data.fromLabel===fl&&e2.data.toLabel===tl)||(e2.data.fromLabel===tl&&e2.data.toLabel===fl);
      });
      var idx=sameEdges.indexOf(e);
      var offset=(idx-(sameEdges.length-1)/2)*130;
      mx+=perp.x*offset; my+=perp.y*offset;
    } else {
      mx=120+i*240; my=cy+r+160;
    }
    e.x=mx-85; e.y=my-50;
    var el=document.getElementById(e.id);
    if(el){el.style.left=e.x+'px';el.style.top=e.y+'px';}
  });

  // Rebuild graph links after repositioning so arrows are accurate
  state.relations=state.relations.filter(function(r){return !r.graphLink;});
  gedges.forEach(function(edge){
    var fl2=edge.data.fromLabel, tl2=edge.data.toLabel;
    function findGN2(t){return state.nodes.find(function(n){return n.data.title===t&&n.subtype==='graph-node';});}
    var fn2=fl2?findGN2(fl2):null, tn2=tl2?findGN2(tl2):null;
    if(fn2) state.relations.push({id:'rel_'+(state.nextId++),fromNodeId:edge.id,fromCol:'__graph__',toNodeId:fn2.id,toCol:'__graph__',graphLink:true,directed:edge.data.directed,isFrom:true});
    if(tn2) state.relations.push({id:'rel_'+(state.nextId++),fromNodeId:edge.id,fromCol:'__graph2__',toNodeId:tn2.id,toCol:'__graph2__',graphLink:true,directed:edge.data.directed,isTo:true});
  });

  drawRelations();
  // fit to content
  var minX=Infinity,minY=Infinity,maxX=0,maxY=0;
  state.nodes.forEach(function(n){
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+200); maxY=Math.max(maxY,n.y+160);
  });
  var padX=60,padY=60;
  var scaleX=(canvasWrap.clientWidth-padX*2)/(maxX-minX||1);
  var scaleY=(canvasWrap.clientHeight-padY*2)/(maxY-minY||1);
  scale=Math.min(0.9, scaleX, scaleY);
  panX=padX-minX*scale; panY=padY-minY*scale;
  applyTransform();
}

function saveEdit(node) {
  snapshot('Element bearbeiten');
  var titleEl=document.getElementById('et-title');
  if(titleEl)node.data.title=titleEl.value;

  function readRows(cid,fields){
    var cont=document.getElementById(cid); if(!cont)return[];
    return Array.from(cont.querySelectorAll('.col-editor-row')).map(function(row){
      var obj={};
      fields.forEach(function(f){
        var el=row.querySelector('[data-f="'+f+'"]');
        if(!el)return;
        obj[f]=el.type==='checkbox'?el.checked:el.value;
      });
      return obj;
    });
  }

  if(node.subtype==='table'){
    node.data.columns=readRows('et-cols',['name','typebase','typeparam','pk','fk','nn','references']).map(function(col){
      col.type=formatType(col.typebase||col.type, col.typeparam);
      return col;
    });
    // rebuild FK relations for this table
    state.relations=state.relations.filter(function(r){return r.fromNodeId!==node.id||r.graphLink;});
    node.data.columns.forEach(function(col){
      if(!col.fk||!col.references)return;
      var parts=col.references.split('.');
      if(parts.length!==2)return;
      var targetTable=state.nodes.find(function(n){return n.subtype==='table'&&n.data.title===parts[0];});
      if(!targetTable)return;
      // check no duplicate
      var exists=state.relations.find(function(r){return r.fromNodeId===node.id&&r.fromCol===col.name;});
      if(!exists) state.relations.push({id:'rel_'+(state.nextId++),fromNodeId:node.id,fromCol:col.name,toNodeId:targetTable.id,toCol:parts[1]});
    });
  }
  else if(node.subtype==='collection'){
    var existing=node.data.fields.filter(function(f){return f.key==='_id';});
    node.data.fields=existing.concat(readRows('et-cols',['key','type','required']));
  }
  else if(node.subtype==='graph-node'||node.subtype==='graph-edge'){
    node.data.props=readRows('et-cols',['name','type']);
    var dirEl=document.getElementById('et-directed');
    if(dirEl) node.data.directed=dirEl.checked;
    var fromEl=document.getElementById('et-from');
    var toEl=document.getElementById('et-to');
    if(fromEl && fromEl.value) node.data.fromLabel=fromEl.value;
    if(toEl && toEl.value) node.data.toLabel=toEl.value;
    // rebuild graph visual SVG links
    if(node.subtype==='graph-edge'){
      state.relations=state.relations.filter(function(r){return !(r.graphLink&&r.fromNodeId===node.id);});
      function findGN(t){return state.nodes.find(function(n){return n.data.title===t&&n.subtype==='graph-node';});}
      var fl=node.data.fromLabel, tl=node.data.toLabel;
      if(fl){var fn2=findGN(fl);if(fn2)state.relations.push({id:'rel_'+(state.nextId++),fromNodeId:node.id,fromCol:'__graph__',toNodeId:fn2.id,toCol:'__graph__',graphLink:true,directed:node.data.directed});}
      if(tl){var tn2=findGN(tl);if(tn2)state.relations.push({id:'rel_'+(state.nextId++),fromNodeId:node.id,fromCol:'__graph2__',toNodeId:tn2.id,toCol:'__graph2__',graphLink:true,directed:node.data.directed,isTo:true});}
    }
  }
  else if(node.subtype==='namespace') node.data.keys=readRows('et-cols',['pattern','type','ttl']);
  else if(node.subtype==='measurement'){
    var ret=document.getElementById('et-retention'); if(ret)node.data.retention=ret.value;
    node.data.tags=readRows('et-tags',['name']);
    node.data.fields=readRows('et-cols',['name','type']);
  }
  else if(node.subtype==='column'){
    node.data.partitionKeys=readRows('et-pk',['name','type']);
    node.data.clusteringKeys=readRows('et-ck',['name','type','order']);
    node.data.columns=readRows('et-cols',['name','type']);
  }

  renderNode(node); drawRelations(); closeModal(); refreshCodePanel();
}

function showExportModal(){
  var extraTabs='';

  if(state.dbType==='column')     extraTabs+='<div class="mtab" onclick="switchExTab(\'cql\',this)">CQL (Cassandra)</div>';
  if(state.dbType==='graph')      extraTabs+='<div class="mtab" onclick="switchExTab(\'cypher\',this)">Cypher (Neo4j)</div>';
  if(state.dbType==='document')   extraTabs+='<div class="mtab" onclick="switchExTab(\'mongo\',this)">MongoDB Shell</div>';
  if(state.dbType==='timeseries') extraTabs+='<div class="mtab" onclick="switchExTab(\'influx\',this)">InfluxDB Line Protocol</div>';
  if(state.dbType==='keyvalue')   extraTabs+='<div class="mtab" onclick="switchExTab(\'redis\',this)">Redis CLI Kommentare</div>';

    '<textarea id="export-ta" readonly></textarea>';

function switchExTab(t,el){
  document.querySelectorAll('.mtab').forEach(function(x){x.classList.remove('active');});
  el.classList.add('active'); genExport(t);
}
function genExport(t){
  var ta=document.getElementById('export-ta'); if(!ta)return;
  var out='';
  if(t==='json') out=JSON.stringify({version:'1.0',dbType:state.dbType,nodes:state.nodes,relations:state.relations},null,2);
  else if(t==='sql') out=genSQL();
  else if(t==='cql') out=genCQL();
  else if(t==='cypher') out=genCypher();
  else if(t==='mongo') out=genMongo();
  else if(t==='influx') out=genInflux();
  else if(t==='redis') out=genRedis();
  ta.value=out;
}

function genSQL(){
  var sql='-- Generated by DB Architect\n-- PostgreSQL / MySQL compatible DDL\n\n';
  state.nodes.filter(function(n){return n.subtype==='table';}).forEach(function(node){
    var d=node.data;
    sql+='CREATE TABLE `'+d.title+'` (\n';
    var cols=d.columns.map(function(col){
      var def='  `'+col.name+'` '+col.type;
      if(col.pk||col.nn) def+=' NOT NULL';
      if(col.pk&&col.type==='SERIAL') def='  `'+col.name+'` SERIAL';
      return def;
    });
    var pks=d.columns.filter(function(c){return c.pk;}).map(function(c){return '`'+c.name+'`';});
    if(pks.length) cols.push('  PRIMARY KEY ('+pks.join(', ')+')');
    sql+=cols.join(',\n')+'\n);\n\n';
  });
  state.relations.forEach(function(rel){
    if(rel.graphLink)return;
    var fn=state.nodes.find(function(n){return n.id===rel.fromNodeId;});
    var tn=state.nodes.find(function(n){return n.id===rel.toNodeId;});
    if(!fn||!tn)return;
    var toCol=rel.toCol||'id';
    sql+='ALTER TABLE `'+fn.data.title+'`\n  ADD CONSTRAINT `fk_'+fn.data.title+'_'+rel.fromCol+'`\n  FOREIGN KEY (`'+rel.fromCol+'`) REFERENCES `'+tn.data.title+'`(`'+toCol+'`);\n\n';
  });
  return sql;
}
function genCQL(){
  var cql='-- Generated by DB Architect\n-- Apache Cassandra / ScyllaDB CQL\n\nCREATE KEYSPACE IF NOT EXISTS my_keyspace\n  WITH replication = {\'class\': \'SimpleStrategy\', \'replication_factor\': 3};\n\nUSE my_keyspace;\n\n';
  state.nodes.filter(function(n){return n.subtype==='column';}).forEach(function(node){
    var d=node.data;
    cql+='CREATE TABLE IF NOT EXISTS '+d.title+' (\n';
    var all=[];
    d.partitionKeys.forEach(function(k){all.push('  '+k.name+' '+k.type);});
    d.clusteringKeys.forEach(function(k){all.push('  '+k.name+' '+k.type);});
    d.columns.forEach(function(c){all.push('  '+c.name+' '+c.type);});
    var pk=d.partitionKeys.map(function(k){return k.name;}).join(', ');
    var ck=d.clusteringKeys.map(function(k){return k.name;}).join(', ');
    all.push('  PRIMARY KEY ('+(ck?'('+pk+'), '+ck:pk)+')');
    cql+=all.join(',\n')+'\n)';
    if(d.clusteringKeys.length){
      cql+='\nWITH CLUSTERING ORDER BY ('+d.clusteringKeys.map(function(k){return k.name+' '+k.order;}).join(', ')+')';
    }
    cql+=';\n\n';
  });
  return cql;
}
function genCypher(){
  var cy='// Generated by DB Architect\n// Neo4j Cypher Schema\n\n';
  state.nodes.filter(function(n){return n.subtype==='graph-node';}).forEach(function(node){
    var d=node.data;
    cy+='// Node Label: :'+d.title+'\n';
    cy+='CREATE CONSTRAINT FOR (n:'+d.title+') REQUIRE n.id IS UNIQUE;\n';
    d.props.forEach(function(p){cy+='// .'+p.name+': '+p.type+'\n';});
    cy+='\n';
  });
  state.nodes.filter(function(n){return n.subtype==='graph-edge';}).forEach(function(node){
    var d=node.data;
    var from=d.fromLabel||'?', to=d.toLabel||'?';
    var arrow=d.directed ? '(:'+from+')-[:'+d.title+']->(:'+to+')' : '(:'+from+')-[:'+d.title+']-(:'+to+')';
    cy+='// Relationship: '+arrow+'\n';
    d.props.forEach(function(p){cy+='// .'+p.name+': '+p.type+'\n';});
    cy+='\n';
  });
  return cy;
}
function genMongo(){
  var sh='// Generated by DB Architect\n// MongoDB Shell\n\n';
  state.nodes.filter(function(n){return n.subtype==='collection';}).forEach(function(node){
    var d=node.data;
    sh+='db.createCollection("'+d.title+'");\n';
    var req=d.fields.filter(function(f){return f.required&&f.key!=='_id';}).map(function(f){return '"'+f.key+'"';});
    sh+='db.runCommand({\n  collMod: "'+d.title+'",\n  validator: {\n    $jsonSchema: {\n      bsonType: "object",\n';
    if(req.length) sh+='      required: ['+req.join(', ')+'],\n';
    sh+='      properties: {\n';
    d.fields.filter(function(f){return f.key!=='_id';}).forEach(function(f){
      sh+='        '+f.key+': { bsonType: "'+f.type.toLowerCase()+'" },\n';
    });
    sh+='      }\n    }\n  }\n});\n\n';
  });
  return sh;
}
function genInflux(){
  var s='// Generated by DB Architect\n// InfluxDB 2.x Schema\n\n';
  state.nodes.filter(function(n){return n.subtype==='measurement';}).forEach(function(node){
    var d=node.data;
    s+='// Measurement: '+d.title+'\n// Retention Policy: '+d.retention+'\n';
    s+='// Tags:   '+d.tags.map(function(t){return t.name;}).join(', ')+'\n';
    s+='// Fields: '+d.fields.map(function(f){return f.name+'('+f.type+')';}).join(', ')+'\n';
    var tagStr=d.tags.map(function(t){return t.name+'=value';}).join(',');
    var fieldStr=d.fields.map(function(f){return f.name+'='+(f.type==='float'?'0.0':f.type==='boolean'?'true':'"value"');}).join(',');
    s+='// Example:\n// '+d.title+','+tagStr+' '+fieldStr+' '+Date.now()+'000000\n\n';
  });
  return s;
}
function genRedis(){
  var s='# Generated by DB Architect\n# Redis Key Pattern Documentation\n\n';
  state.nodes.filter(function(n){return n.subtype==='namespace';}).forEach(function(node){
    var d=node.data;
    s+='# Namespace: '+d.title+'\n';
    d.keys.forEach(function(k){
      s+='# Key:  '+k.pattern+'\n# Type: '+k.type+(k.ttl!=='—'?'\n# TTL:  '+k.ttl:'')+'\n';
      if(k.type==='Hash') s+='# HSET '+k.pattern.replace('{id}','1')+' field1 value1\n';
      else if(k.type==='List') s+='# RPUSH '+k.pattern.replace('{id}','1')+' value1\n';
      else if(k.type==='Set') s+='# SADD '+k.pattern.replace('{id}','1')+' member1\n';
      else s+='# SET '+k.pattern.replace('{id}','1')+' value\n';
      s+='\n';
    });
  });
  return s;
}

  var ta=document.getElementById('import-ta');
  ta.dataset.mode=t;

    ?'SQL Dump oder DDL hier einfügen…\n\nUnterstützt: CREATE TABLE, ALTER TABLE ... ADD FOREIGN KEY\nIgnoriert: INSERT, UPDATE, DELETE, LOCK, SET, Kommentare usw.'
